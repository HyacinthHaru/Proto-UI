id: P-BASE-TOOLTIP-PORTAL
type: prototype
title: Base Tooltip Portal anatomy part
status: draft
since: 0.2.0-rc.7
summary: Portal is an optional logical anatomy carrier and does not yet move a view.
statement:
  en: Portal claims the optional portal role and provides direct and authored asHook entries without renderer portal ownership, overlay, presence, or positioning behavior.
  zh-CN: Portal claim 可选的 portal role，并提供 direct 与 authored asHook entries；不包含 renderer portal ownership、overlay、presence 或 positioning behavior。
criteria:
  - id: P-BASE-TOOLTIP-PORTAL-ANATOMY-ONLY
    text:
      en: Portal must claim the portal role and expose no props, state, events, renderer portal, overlay, presence, or positioning behavior in this shell slice.
      zh-CN: 在本 shell 切片中，Portal 必须 claim portal role，且不得 expose props、state、events、renderer portal、overlay、presence 或 positioning behavior。
