id: P-SHADCN-SURFACE
type: prototype
title: shadcn passive Surface atom
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded passive presentation atom under current user-directed normalization. Draft pending independent review and exact-source browser evidence; native/compiler omissions remain explicit rather than implied by Web behavior.
summary: Reusable passive content surface with presentation-only facts, independent of any page or navigation protocol.
statement:
  en: Surface owns a slotted visual shell. Its consumer supplies layout, content and facts from the existing semantic owner. It does not own hover detection, focus, activation, selection, navigation, disclosure, clipboard, source editing or material effects. This design projection inherits Base Surface and lowers visual rules through standard feedback styles. No homepage, preview, code-toolbar or social-icon vocabulary is part of the API.
criteria:
  - id: P-SHADCN-SURFACE-PASSIVE
    text:
      en: Surface introduces no role, tabindex, focus request, event listener, activation, semantic state, native property forwarding or exposed method. Authored content remains in its original semantic ownership. Observed presentation inputs are not an event simulation or an independent interaction truth.
  - id: P-SHADCN-SURFACE-INPUTS
    text:
      en: Inputs are variant transparent|outline|secondary|muted|accent|solid, radius default|none|sm|md|lg|xl|full, border all|bottom|none, elevation none|raised, and boolean hovered/focusVisible/pressed/current. Defaults are outline/default/all/none and all false. Absent inputs restore defaults. Family is not a Surface prop.
  - id: P-SHADCN-SURFACE-PROJECTION
    text:
      en: The family inherits asSurfaceRoot and owns its finite fill, border, radius, depth and observed-feedback recipes through rule/feedback.style. Surface does not choose font, text size or content. Pointer hit ownership stays with the semantic host. Unsupported native lowering remains diagnostic, never an inferred support claim.
  - id: P-SHADCN-SURFACE-ENTRIES
    text:
      en: The public package root and /surface subpath expose Surface, with CLI registration for adapter facade consumption. Partial-family Surface is neutral opaque presentation and does not expand material or unrelated component compatibility guarantees.
sources:
