id: P-BASE-SCROLL-AREA-VIEWPORT
type: prototype
title: Base Scroll Area Viewport protocol
status: draft
since: 0.2.0-rc.7
summary: Native overflow surface that publishes host scroll and client metrics.
statement:
  en: Base Scroll Area Viewport owns native `overflow-auto`, publishes six host-derived metrics, and applies versioned scroll requests from the family context.
  zh-CN: Base Scroll Area Viewport 拥有原生 `overflow-auto`，发布六个 host-derived metric，并应用 family context 中带版本的 scroll request。
criteria:
  - id: P-BASE-SCROLL-AREA-VIEWPORT-METRICS
    text:
      en: On mount, update, and host scroll, Viewport publishes `scrollTop`, `scrollLeft`, `scrollHeight`, `scrollWidth`, `clientHeight`, and `clientWidth` exactly as read from its host and exposes the same values as state.
      zh-CN: 在 mount、update 与 host scroll 时，Viewport 按 host 实际值发布 `scrollTop`、`scrollLeft`、`scrollHeight`、`scrollWidth`、`clientHeight` 与 `clientWidth`，并将相同值暴露为 state。
  - id: P-BASE-SCROLL-AREA-VIEWPORT-REQUEST
    text:
      en: Each new context request applies only the requested axis to the host, then republishes the resulting host metrics; an omitted axis is not replayed from an older request.
      zh-CN: 每个新的 context request 只将被请求的轴应用到 host，随后重新发布结果 metrics；未提供的轴不会从旧 request 重放。
sources:
  - path: packages/prototypes/base/src/scroll-area/viewport.proto.ts
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced base scroll area viewport protocol.
verifies:
