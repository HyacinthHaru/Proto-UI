revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Bind independent static hover, focus, quiet disabled paint and existing self-contact to the shared six-part draft recipe without introducing input ownership or claiming Apple-native equivalence.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Cataloged the draft Base-inheriting visual Button foundation with explicit material, release and host limits.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added bounded live material policy and opt-out; real-Web material evidence remains planned until the exact-head consumer fixture runs.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Replaced the stage-0 alpha/blur rule with explicit V2 optical intent; real provider admission and source-bound browser evidence remain draft obligations.
