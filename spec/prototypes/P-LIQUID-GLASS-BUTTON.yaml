id: P-LIQUID-GLASS-BUTTON
type: prototype
title: Liquid Glass optical-intent Button projection over Base Button
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: A user-directed, independently authored visual foundation. Full family/component coverage, material capability where applicable, generated/native evidence and stable admission remain open; source package availability is not release or conformance admission.
summary: A regular functional Button submits V2 liquid-glass optical intent with Base press deformation, source-owned opaque fallback and solid prominent action.
statement:
  en: A regular functional Button submits V2 liquid-glass optical intent with Base press deformation, source-owned opaque fallback and solid prominent action. material is auto | opaque (default auto); variant is regular | prominent. Base remains the sole interaction owner. The host owns source, preference and actual paint admission; missing support retains opaque style. Reduced motion limits deformation without implying reduced transparency.
criteria:
  - id: P-LIQUID-GLASS-BUTTON-BASE
    text:
      en: The Prototype invokes asButton() once, preserves inherited interaction, focus, disabled and click ownership, and consumes only its exposed state handles for visual Rules.
  - id: P-LIQUID-GLASS-BUTTON-API
    text:
      en: variant is regular | prominent (default regular), material is auto | opaque (default auto), and inherited disabled defaults false. Removing a visual prop restores its default.
  - id: P-LIQUID-GLASS-BUTTON-VISUAL
    text:
      en: The regular functional surface uses capsule geometry and readable source-owned light/dark colors. Auto requests explicit liquid-glass through the shared material slot; only an evidenced self-optical provider may enhance it. CSS blur and native adaptive blur are not substitutes. Prominent remains solid. No Apple-private or cross-engine equivalence is promised.
  - id: P-LIQUID-GLASS-BUTTON-CLOSURE
    text:
      en: Appearance is authored in feedback tokens and state/prop Rules; every token has an explicit physical translation. Standalone Web output must not depend on website component CSS or reset rules.
  - id: P-LIQUID-GLASS-BUTTON-BOUNDARY
    text:
      en: The package is private and unreleased. Initial source and Web evidence do not establish general Prototype Compiler, GPUI, Flutter or Qt support. Homepage and full component coverage remain separate work.
  - id: P-LIQUID-GLASS-BUTTON-MATERIAL
    text:
      en: Enabled regular auto contributes one complete V2 liquid-glass candidate with finite press deformation driven by existing Base state and a finite pointer-contact request to the existing host input owner. Held drag tracking is visual-only and does not change Base activation or pointer-leave semantics. Disabled, opaque opt-out and prominent contribute zero candidates, retaining the declared opaque fallback. Provider policy resolves final style ownership, current source scope, geometry and preferences. Reduced or unknown motion selects static optics when supported; reduced/unknown transparency and unsafe contrast withdraw enhancement. No browser observer, GPU uniform or input owner belongs to this Prototype.
  - id: P-LIQUID-GLASS-BUTTON-COMMAND-INTERACTION
    text:
      en: Follow the bounded shared command recipe; eligible static hover is independent of pressed, persistent selection and focus-visible. Base owns all transient and semantic state; the family only projects data-only physical tokens through Rules in its owning setup. Disabled commands retain readable same-state opaque fallback without whole-host opacity. Exact-head native images and current contact footprint acceptance remain required.
      zh-CN: 遵守有界共享 command 配方：可交互静态 hover 与 pressed、持久选择和 focus-visible 独立。所有瞬态及语义状态仍由 Base 拥有，family 仅在本 setup 内通过 Rules 投影数据型物理 tokens。禁用后保留可读的同状态不透明 fallback，不降低整个宿主的透明度。仍须精确源码 native 图像与当前 contact 绘制边界验收。
    dependsOn:
      contracts: [C-LIQUID-GLASS-COMMAND-INTERACTION-0001]
