id: P-BASE-SCROLL-AREA
type: prototype
title: Base Scroll Area protocol
status: draft
since: 0.2.0-rc.7
summary: Five-part Scroll Area anatomy with host-derived metrics and bidirectional Thumb drag requests.
statement:
  en: Base Scroll Area defines Root, Viewport, Scrollbar, Thumb, and Corner anatomy. Viewport publishes native host metrics; Thumb derives exact geometry ratios and requests clamped scrolling for its explicit orientation. Native overflow remains host-owned; virtualization, inertia, auto-hide, and RTL policy remain outside this entity.
  zh-CN: Base Scroll Area 定义 Root、Viewport、Scrollbar、Thumb 与 Corner anatomy。Viewport 发布原生 host metrics；Thumb 根据显式 orientation 推导精确 geometry ratio，并请求经过 clamp 的滚动。原生 overflow 仍由 host 拥有；virtualization、inertia、auto-hide 与 RTL policy 不属于本实体。
criteria:
  - id: P-BASE-SCROLL-AREA-ANATOMY
    text:
      en: Root and Viewport are required singletons; Root may contain up to two Scrollbars and one Corner; the family allows up to two Thumbs, each contained by a Scrollbar.
      zh-CN: Root 与 Viewport 为必需 singleton；Root 最多包含两个 Scrollbar 与一个 Corner；family 最多允许两个 Thumb，且每个 Thumb 由 Scrollbar 包含。
  - id: P-BASE-SCROLL-AREA-BEHAVIOR-BOUNDARY
    text:
      en: Scrollbar and Thumb accept `horizontal | vertical` orientation with default `vertical`. Root provides request/metrics context; Viewport and Thumb own only the bounded behavior criteria in their part entities. Root and Corner define no public props, state, events, or focus behavior.
      zh-CN: Scrollbar 与 Thumb 接受默认 `vertical` 的 `horizontal | vertical` orientation。Root 提供 request/metrics context；Viewport 与 Thumb 只拥有各自 part entity 中界定的行为。Root 与 Corner 不定义公开 prop、state、event 或 focus 行为。
sources:
