id: P-BASE-SCROLL-AREA
type: prototype
title: Base Scroll Area protocol
status: draft
since: 0.2.0-rc.7
summary: Five-part behaviorless Scroll Area anatomy for downstream visual and behavior projections.
statement:
  en: Base Scroll Area defines Root, Viewport, Scrollbar, Thumb, and Corner anatomy. This shell slice owns only part identity, containment, and Scrollbar orientation; portable metrics and thumb drag behavior remain outside this entity.
  zh-CN: Base Scroll Area 定义 Root、Viewport、Scrollbar、Thumb 与 Corner anatomy。本 shell 切片只拥有 part identity、containment 与 Scrollbar orientation；可移植 metrics 与 thumb 拖拽行为不属于本实体。
criteria:
  - id: P-BASE-SCROLL-AREA-ANATOMY
    text:
      en: Root and Viewport are required singletons; Root may contain up to two Scrollbars and one Corner; the family allows up to two Thumbs, each contained by a Scrollbar.
      zh-CN: Root 与 Viewport 为必需 singleton；Root 最多包含两个 Scrollbar 与一个 Corner；family 最多允许两个 Thumb，且每个 Thumb 由 Scrollbar 包含。
  - id: P-BASE-SCROLL-AREA-SHELL-BOUNDARY
    text:
      en: Root, Viewport, Thumb, and Corner define no props, state, events, focus, metrics, or drag behavior. Scrollbar owns only `horizontal | vertical` orientation state with default `vertical`.
      zh-CN: Root、Viewport、Thumb 与 Corner 不定义 props、state、event、focus、metrics 或 drag 行为；Scrollbar 只拥有默认 `vertical` 的 `horizontal | vertical` orientation state。
sources:
  - path: packages/prototypes/base/src/scroll-area/root.proto.ts
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced Base Scroll Area protocol.
verifies:
