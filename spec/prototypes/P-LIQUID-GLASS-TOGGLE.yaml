revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Add finite selected style-fill tint with same-state readable foreground and fallback; text underline and fixed geometry remain, while icon-only and exact-head optical acceptance stay separate.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Add a standalone Proto Toggle projection with regular optical intent in both selected states, equal geometry and explicit selected-tint and native/compiler limits.
