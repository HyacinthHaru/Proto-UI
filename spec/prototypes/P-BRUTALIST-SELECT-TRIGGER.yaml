id: P-BRUTALIST-SELECT-TRIGGER
type: prototype
title: 'Brutalist Select Trigger inherits Base and projects a rounded main-filled surface with explicit elevation'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Select Trigger retains Base state and chevron anatomy, a compatible flat default and elevated option, and an additive transparent ghost presentation with theme-dependent foreground.'

statement:
  en: P-BRUTALIST-SELECT-TRIGGER preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-SELECT-TRIGGER 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-SELECT-TRIGGER-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Select Trigger through `asSelectTrigger()` once and must not redefine Base open, disabled, hovered, focusVisible, pressed, or placeholder protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asSelectTrigger()` 一次性继承 Base Select Trigger，不得重定义 Base 的 open、disabled、hovered、focusVisible、pressed 或 placeholder 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-SELECT-TRIGGER-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-select-trigger`.
      zh-CN: 直接 prototype 入口名为 `brutalist-select-trigger`。
  - id: P-BRUTALIST-SELECT-TRIGGER-SIZE-PROP
    text:
      en: >-
        Public `size` is the enum `sm | default` with default `default`. `default` maps to `h-9`; `sm` maps to `h-8`. There is no `lg` or `icon` size for Select Trigger.


      zh-CN: >-
        公开 `size` 为枚举 `sm | default`，默认 `default`。`default` 对应 `h-9`；`sm` 对应 `h-8`。Select Trigger 不提供 `lg` 或 `icon` 尺寸。


  - id: P-BRUTALIST-SELECT-TRIGGER-DEFAULTS
    text:
      en: Omitted or removed size restores default. Omitted or removed appearance restores flat, withdrawing ghost, elevation and movement tokens even during active interaction.
      zh-CN: size 缺省或移除时恢复 default；appearance 缺省或移除时恢复 flat，即使交互中也撤回 ghost、elevation 与位移 tokens。

  - id: P-BRUTALIST-SELECT-TRIGGER-PLACEHOLDER-STATE
    text:
      en: Flat and elevated placeholder/value text use the main fill paired text-main-foreground. Ghost placeholder/value use text-foreground against the transparent or neutral interaction surface in both themes; it must not inherit black main ink on a dark transparent surface.
      zh-CN: flat 与 elevated 的 placeholder/value 使用 main fill 配对 text-main-foreground；ghost 的 placeholder/value 在明暗主题均使用 text-foreground 对应透明或中性交互表面，不得在深色透明背景上继承黑色 main ink。

  - id: P-BRUTALIST-SELECT-TRIGGER-CHEVRON
    text:
      en: >-
        The trigger renders a trailing chevron icon (a 16×16 SVG path `m6 9 6 6 6-6`) after its slot, with `pointer-events-none` so the icon never captures pointer interaction.


      zh-CN: >-
        trigger 在其 slot 之后渲染尾部 chevron 图标（16×16 SVG 路径 `m6 9 6 6 6-6`），并设置 `pointer-events-none`，使图标永不捕获指针交互。


  - id: P-BRUTALIST-SELECT-TRIGGER-INTERACTION
    text:
      en: Flat hover/press retain the flat black frame without translation/elevation. Elevated follows its explicit appearance criterion. Ghost hover/press retain transparent borders without movement or hard shadow and use the neutral paired surface. Every appearance keeps the existing focus-visible ring/offset and disabled opacity/pointer gate, derived only from Base states. Main-filled placeholder contrast remains at least 4.5:1 in both themes.
      zh-CN: flat hover/press 保留平坦黑框且无位移/elevation；elevated 遵循其显式外观准则；ghost hover/press 保留透明边框，无位移/硬影并使用中性配对表面。所有 appearance 都保留现有 focus-visible ring/offset 与 disabled opacity/pointer gate，仅消费 Base states。main-filled placeholder 在明暗主题对比度仍至少4.5:1。

  - id: P-BRUTALIST-SELECT-TRIGGER-VISUAL-GRAMMAR
    text:
      en: Default flat remains rounded-base 5px, border-2 border-black, bg-main/text-main-foreground, font-sans font-medium text-sm, px-3 py-2 and no shadow/translation. Ghost retains geometry and typography with border-transparent/bg-transparent/text-foreground. Existing sm/default dimensions, chevron anatomy and inherited behavior remain unchanged.
      zh-CN: 默认 flat 仍为 rounded-base 5px、border-2 border-black、bg-main/text-main-foreground、font-sans font-medium text-sm、px-3 py-2，无阴影/位移；ghost 保留几何字体，使用 border-transparent/bg-transparent/text-foreground。现有 sm/default 尺寸、chevron anatomy 与继承行为不变。

  - id: P-BRUTALIST-SELECT-TRIGGER-APPEARANCE
    text:
      en: 'Public appearance is flat | elevated | ghost, default flat. Flat/elevated retain their existing main-fill paired ink, black 2px border, 5px radius, DM Sans 500 and sizes. Elevated alone adds a 4px/4px hard shadow and inherited hover/press +4px/+4px shadow-clearing feedback. Ghost is an additive Proto UI extension with transparent border/background, theme foreground and no shadow/displacement/hit-envelope; hover/press uses the neutral secondary-background/foreground pair. It changes Trigger presentation only: Content and Base behavior remain unchanged.'
      zh-CN: 公开 appearance 为 flat | elevated | ghost，默认 flat。flat/elevated 保留 main fill 配对 ink、2px 黑边、5px 圆角、DM Sans 500 与尺寸；仅 elevated 增加 4px/4px 硬影及继承 hover/press 的 +4px/+4px 去影反馈。ghost 为 Proto UI 自有扩展，边框/背景透明、主题前景、无阴影/位移/hit-envelope；hover/press 使用 secondary-background/foreground 中性色对。只改变 Trigger 呈现，Content 与 Base 行为不变。

