id: P-BASE-SWITCH-THUMB
type: prototype
title: Base Switch Thumb is a context-driven switch indicator
status: draft
since: 0.1.0
summary: Base Switch Thumb is the optional and repeatable indicator part of Base Switch. It claims the Switch thumb anatomy role, consumes Switch context to reflect root state visually, and does not own value, activation, focus, accessibility control, form, or event semantics.
statement:
  zh-CN: >-
    Base Switch Thumb 是 Base Switch anatomy family 中可选且可重复的 indicator part。`base-switch-thumb` direct prototype 与 `asSwitchThumb` authored asHook 是同一 Switch thumb protocol 的两个 authoring entries。Thumb 通过 Switch context 读取或订阅 root 提供的 checked/disabled 信息，将其作为派生展示状态使用；它不拥有 checked/on-off value，不处理 activation，不作为 event target，也不发出 outward signal。


  en: >-
    Base Switch Thumb is the optional and repeatable indicator part in the Base Switch anatomy family. The `base-switch-thumb` direct prototype and the `asSwitchThumb` authored asHook are two authoring entries of the same Switch thumb protocol. Thumb reads or subscribes to checked/disabled information provided by the root through Switch context and uses it as derived display state; it does not own checked/on-off value, process activation, act as an event target, or emit outward signals.


criteria:
  - id: P-BASE-SWITCH-THUMB-DERIVED-PREVIEW
    text:
      en: Thumb may derive percentage and dragging only from Root-provided Switch context under P-BASE-SWITCH-DIRECTIONAL-PREVIEW. These are display state, not checked truth or a new input, focus or accessibility owner. Its geometry may be a uniquely resolved read-only travel target; no listener, capture, coordinate or contact identity is introduced on Thumb. Repeatable Thumb remains valid presentation, while ambiguous travel geometry refuses only the drag enhancement.
    dependsOn:
      contracts:
        - id: C-AXIS-INPUT-DIRECTIONAL-0001
          since: 0.3.0-alpha.1
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors: [P-BASE-SWITCH-DIRECTIONAL-PREVIEW]
  - id: P-BASE-SWITCH-THUMB-ROLE-INDICATOR
    text:
      zh-CN: Switch Thumb 只能作为 Switch root state 的 visual indicator；它不是 value control，也不是 command control。
      en: Switch Thumb may only be a visual indicator for Switch root state; it is neither a value control nor a command control.
    dependsOn:
      contracts:
        - C-ANATOMY-0008
      knowledge:
        - K-COMPONENT-INTERACTION-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-THUMB-INDICATOR
  - id: P-BASE-SWITCH-THUMB-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-switch-thumb` direct prototype 与 `asSwitchThumb` authored asHook 是同一 Switch thumb protocol 的两个 authoring entries。'
      en: 'The `base-switch-thumb` direct prototype and the `asSwitchThumb` authored asHook are two authoring entries of the same Switch thumb protocol.'
    dependsOn:
      contracts:
        - C-CORE-SYNTAX-0003
        - C-AS-HOOK-0001
      decisions:
        - D-PROTOTYPE-ENTITY-NAMING-0001
  - id: P-BASE-SWITCH-THUMB-PROTOCOL-DEPENDENCY
    text:
      zh-CN: Switch Thumb 的语义成立依赖 `P-BASE-SWITCH` 定义的 Switch anatomy family 与 Switch context；它不得脱离 Switch root 自行定义开关语义。
      en: Switch Thumb semantics depend on the Switch anatomy family and Switch context defined by `P-BASE-SWITCH`; it must not define switch semantics independently from Switch root.
    dependsOn:
      prototypes:
        - P-BASE-SWITCH
  - id: P-BASE-SWITCH-THUMB-CLAIM-ROLE
    text:
      zh-CN: Switch Thumb 必须 claim `base-switch` anatomy family 的 `thumb` role。
      en: Switch Thumb must claim the `thumb` role in the `base-switch` anatomy family.
    dependsOn:
      contracts:
        - C-ANATOMY-0004
        - C-ANATOMY-0005
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-FAMILY-ROLES
            - P-BASE-SWITCH-THUMB-CARDINALITY
  - id: P-BASE-SWITCH-THUMB-SAME-DOMAIN
    text:
      zh-CN: Switch Thumb 必须解析到同一 Switch domain 中的 Switch root；跨 Switch domain 的 root state 不得被读取或展示。
      en: Switch Thumb must resolve to the Switch root in the same Switch domain; root state from another Switch domain must not be read or displayed.
    dependsOn:
      contracts:
        - C-ANATOMY-0005
        - C-CONTEXT-0002
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-ROOT-DOMAIN-ANCHOR
            - P-BASE-SWITCH-ROOT-CONTAINS-THUMB
  - id: P-BASE-SWITCH-THUMB-CONTEXT-SUBSCRIBE
    text:
      zh-CN: Switch Thumb 必须通过 Switch context 读取或订阅 root state；不得通过复制 root props、读取 host DOM 状态或依赖 root exposed state 来获得 Switch 协作信息。
      en: Switch Thumb must read or subscribe to root state through Switch context; it must not obtain Switch coordination information by copying root props, reading host DOM state, or depending on root exposed state.
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-CONTEXT-0007
      prototypes:
        - P-BASE-SWITCH
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-CONTEXT-KEY
            - P-BASE-SWITCH-PART-CONTEXT-CONSUME
  - id: P-BASE-SWITCH-THUMB-CONTEXT-REQUIRED
    text:
      zh-CN: Switch Thumb 的 Switch context 是必需依赖；setup 期间若无法解析同域 Switch context，Thumb 不得静默创建自治 checked state。
      en: Switch context is a required dependency for Switch Thumb; if same-domain Switch context cannot be resolved during setup, Thumb must not silently create autonomous checked state.
    dependsOn:
      contracts:
        - C-CONTEXT-0006
        - C-STATE-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-CONTEXT-PROVIDE
            - P-BASE-SWITCH-CONTEXT-VALUE
  - id: P-BASE-SWITCH-THUMB-DERIVED-CHECKED
    text:
      zh-CN: Switch Thumb 可以 expose 或提供派生的 `checked` display state，但该 state 必须来源于 Switch context，且不得成为 checked/on-off value 的 source of truth。
      en: Switch Thumb may expose or provide derived `checked` display state, but that state must come from Switch context and must not become the source of truth for checked/on-off value.
    dependsOn:
      contracts:
        - C-CONTEXT-0007
        - C-EXPOSE-STATE-0001
        - C-STATE-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-CONTEXT-VALUE
            - P-BASE-SWITCH-CONTEXT-SYNC
  - id: P-BASE-SWITCH-THUMB-DERIVED-DISABLED
    text:
      zh-CN: Switch Thumb 可以读取 `disabled` 作为派生展示状态；disabled 不赋予 Thumb 独立的交互 gating 责任，因为 Thumb 不处理 activation。
      en: Switch Thumb may read `disabled` as derived display state; disabled does not give Thumb independent interaction gating responsibility because Thumb does not process activation.
    dependsOn:
      contracts:
        - C-CONTEXT-0007
        - C-STATE-INTERACTION-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-CONTEXT-VALUE
            - P-BASE-SWITCH-DISABLED-SUPPRESS-ACTIVATION
  - id: P-BASE-SWITCH-THUMB-NO-VALUE-OWNER
    text:
      zh-CN: Switch Thumb 不得接受 `checked`、`defaultChecked` 或 value-change callback props，也不得发出 `checkedChange`。
      en: Switch Thumb must not accept `checked`, `defaultChecked`, or value-change callback props, and must not emit `checkedChange`.
    dependsOn:
      contracts:
        - C-PROPS-0001
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-PROP-CHECKED
            - P-BASE-SWITCH-PROP-DEFAULT-CHECKED
            - P-BASE-SWITCH-CHECKED-CHANGE-SIGNAL
  - id: P-BASE-SWITCH-THUMB-NO-EVENT-TARGET
    text:
      zh-CN: Switch Thumb 不得作为独立 event target，不得注册 activation route，也不得使用 Event 通路表达自身行为。
      en: Switch Thumb must not act as an independent event target, must not register activation routes, and must not use the Event channel to express its own behavior.
    dependsOn:
      contracts:
        - C-EVENT-TYPE-0001
        - C-EXPOSE-EVENT-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-THUMB-NOT-TARGET
            - P-BASE-SWITCH-TRIGGER-SEMANTICS
  - id: P-BASE-SWITCH-THUMB-NO-FOCUS-TARGET
    text:
      zh-CN: Switch Thumb 不得成为独立 focus target；Switch 的焦点责任属于 Switch root。
      en: Switch Thumb must not become an independent focus target; Switch focus responsibility belongs to Switch root.
    dependsOn:
      contracts:
        - C-AS-FOCUSABLE-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-FOCUSABLE
  - id: P-BASE-SWITCH-THUMB-PRESENTATIONAL-A11Y
    text:
      zh-CN: Switch Thumb 不得成为独立 accessible control；它必须作为 root switch 语义的呈现结构。
      en: Switch Thumb must not become an independent accessible control; it must remain presentational structure for the root switch semantics.
    dependsOn:
      contracts:
        - C-A11Y-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-INDICATOR-PRESENTATIONAL-A11Y
  - id: P-BASE-SWITCH-THUMB-NO-FORM-INTEGRATION
    text:
      zh-CN: Switch Thumb 不参与 Form 联动；任何 form-associated value 或 hidden input 行为都不得归属于 Thumb。
      en: Switch Thumb does not participate in Form integration; any form-associated value or hidden input behavior must not belong to Thumb.
    dependsOn:
      contracts:
        - C-PROPS-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-FORM-INTEGRATION-DEFERRED
  - id: P-BASE-SWITCH-THUMB-NO-VISUAL-VARIANT-CORE
    text:
      zh-CN: Switch Thumb core contract 不定义 size、motion、shape、tone、track-relative position 等视觉参数。
      en: Switch Thumb core contract does not define visual parameters such as size, motion, shape, tone, or track-relative position.
    dependsOn:
      decisions:
        - D-BASE-PROTOTYPE-INDEPENDENCE-0001
      knowledge:
        - K-DESIGN-TRADEOFF-0001
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            - P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE
