id: P-BASE-TOOLTIP-TRIGGER
type: prototype
title: Base Tooltip Trigger anatomy part
status: draft
since: 0.2.0-rc.7
summary: Trigger is the required anatomy carrier in the static Base Tooltip shell.
statement:
  en: Trigger claims the required trigger role and provides direct and authored asHook entries without hover, focus, activation, naming, or open-request behavior.
  zh-CN: Trigger claim 必需的 trigger role，并提供 direct 与 authored asHook entries；不包含 hover、focus、activation、naming 或 open-request behavior。
criteria:
  - id: P-BASE-TOOLTIP-TRIGGER-ANATOMY-ONLY
    text:
      en: Trigger must claim the trigger role and expose no props, state, events, focus, activation, accessibility, or visibility behavior in this shell slice.
      zh-CN: 在本 shell 切片中，Trigger 必须 claim trigger role，且不得 expose props、state、events、focus、activation、accessibility 或 visibility behavior。
sources:
  - path: packages/prototypes/base/src/tooltip/trigger.proto.ts
  - path: packages/prototypes/base/src/tooltip/types.ts
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced the behaviorless Tooltip Trigger anatomy part.
tags: [prototype, base, tooltip, trigger, anatomy]
verifies:
