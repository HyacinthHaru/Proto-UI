id: P-SHADCN-BUTTON
type: prototype
title: Shadcn Button inherits Base Button and layers a pinned visual API subset
status: draft
since: 0.2.0-rc.0
summary: Shadcn Button is an unofficial Proto UI-maintained projection that inherits Base Button by default, may declare setup-time negative patches explicitly, and adds a pinned, currently partial shadcn/ui visual API without duplicating Base semantics.
statement:
  zh-CN: >-
    Shadcn Button 是在 `P-BASE-BUTTON` 之上提供 shadcn/ui Button 外观与 API 投射的 direct prototype。当前协议保留 Base Button 的 command、activation、focus、disabled、a11y 与 outward-signal 行为，并新增六种 `variant`、四种既有 `size` 及显式 Proto 扩展 `icon-compact`、命名外观 `styleProfile`（默认 rhea、可选 luma）、由 Button interaction state 驱动的视觉反馈，以及 outline、destructive 与 ghost 在 dark color scheme 下的样式增量。历史 API 兼容比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Button；当前 destructive 的 tinted visual recipe 另有意采用较新的官方 recipe 作为视觉来源证据，但该采用不移动整体兼容比较基线，也不扩大 current passing guarantee。`asChild` 是明确不提供的 API，其他未对齐项统一记录为 compatibility differences。当前首页外观的受限来源由下方 Rhea/Luma profile criterion 单列，不把历史基线视为当前视觉对齐证明。


  en: >-
    Shadcn Button is a direct prototype that projects the shadcn/ui Button API and appearance over `P-BASE-BUTTON`. The current protocol retains Base Button command, activation, focus, disabled, accessibility, and outward-signal behavior while adding six `variant` values, four existing `size` values plus the explicit Proto extension `icon-compact`, the named `styleProfile` presentation (default rhea, optional luma), visual feedback driven by Button interaction state, and dark-color-scheme styling deltas for outline, destructive, and ghost variants. Its historical API comparison baseline remains the v4 new-york Button at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; the current tinted destructive visual recipe separately records an intentional adoption of a later official recipe as visual-source evidence, without advancing the overall compatibility baseline or widening the current passing guarantee. `asChild` is explicitly unavailable, and every other divergence is tracked as a compatibility difference. The bounded current homepage visual source is separately identified by the Rhea/Luma profile criterion below, rather than claiming visual parity with the historical baseline.


criteria:
  - id: P-SHADCN-BUTTON-RHEA-LUMA-PROFILES
    text:
      en: Public styleProfile is rhea|luma with default rhea. It identifies the fixed upstream homepage card and hero imports, not a universal Shadcn default. Rhea default/sm/lg/icon use 2/1.75/2.25/2rem; Luma uses 2.25/2/2.5/2.25rem. Both default and sm have 0.75rem inline padding, lg has 1rem; default/lg gap is 0.375rem and sm gap 0.25rem. All supported sizes retain 0.875rem text with 1.25rem leading. Named corners are theme radius plus 8px for Rhea and plus 16px for Luma, giving 18px/26px at the canonical 10px theme radius. Existing generic rounded-2xl is not redefined. Wrap keeps each profile minimum and allows growth with py-1; icon and Proto icon-compact remain fixed. Removing profile restores Rhea. No xs/new icon size, asChild, aria-invalid, nested SVG or expanded-state parity is inferred. The upstream first hero 35px consumer override is not reproduced by this public 36px Luma default.
      zh-CN: 公开 styleProfile 为 rhea|luma，默认 rhea，分别标识固定上游首页卡片与 hero 来源而非唯一 Shadcn 默认。Rhea default/sm/lg/icon 为 32/28/36/32px，Luma 为 36/32/40/36px；字号均 14px、行高 20px，default/sm 水平 padding 12px、lg 为 16px。Rhea/Luma 圆角为主题 radius 加 8px/16px，标准主题为 18px/26px，不重定义全局 rounded-2xl。wrap 保留对应最小高度并允许增长，icon 与 Proto compact 固定；省略 profile 恢复 Rhea。不宣称未实现子集对齐，首 hero 的上游页面 35px 特例不由默认 Luma 36px 伪装。
  - id: P-SHADCN-BUTTON-ICON-COMPACT
    text:
      en: The explicit Proto UI icon-compact size uses size-7 gap-2 (1.75rem square) and remains fixed when wrap is true. It projects the consumer size-7 override in shadcn Blocks at ba1503c64472b82256d9de95e2e62c5901a38e8b, not a same-named upstream size API; upstream icon-sm is size-8 and icon-xs is size-6. It preserves inherited activation, focus, disabled and accessible-name ownership, adds no layout override bypass, and does not move the historical compatibility baseline or claim full Button parity. The compact extension remains 28px with the prior 8px theme-relative corner; the explicit Rhea/Luma migration separately governs other sizes and defaults. Native sizing and focus evidence are required separately from token tests.
      zh-CN: 显式 Proto UI 扩展 icon-compact 使用 size-7 gap-2（1.75rem 正方形），wrap 为 true 时仍固定尺寸。它映射 shadcn Blocks ba1503c64472b82256d9de95e2e62c5901a38e8b 的 consumer size-7 覆盖，不是上游同名 size API；上游 icon-sm 为 size-8，icon-xs 为 size-6。它保留继承的激活、焦点、禁用和 accessible name 所有权，不新增布局覆盖旁路，不移动历史兼容基线或声称完整 Button 对齐。其他 size 与省略 size 的默认值不变；原生尺寸和焦点证据须独立于 token 测试验证。
  - id: P-SHADCN-BUTTON-WRAP-PROP
    text:
      zh-CN: 可选 wrap 布尔呈现选项默认 false；非 icon size 启用后在容器可用宽度内换行、以原 size 高度为最小高度，不改变 Base activation、焦点或 accessible name。icon 与 icon-compact size 保持固定尺寸。该选项是 Proto UI 扩展，不属于上游逐字 API 兼容承诺；容器及自定义后代仍须提供可用宽度，不能推断任意嵌套内容都可自动修复。
      en: Optional boolean wrap defaults to false. For non-icon sizes it wraps labels within the containing width and uses the original size height as a minimum, without changing Base activation, focus or accessible names. Icon and icon-compact sizes retain fixed dimensions. This Proto UI extension is not a literal upstream API parity claim; containers and custom descendants must still provide usable width, and arbitrary nested content is not automatically repaired.
  - id: P-SHADCN-BUTTON-NEW-YORK-PAINT
    text:
      en: This historical criterion ID now distinguishes two owners. Direct Button uses named Rhea (default) and Luma profiles from shadcn-ui/ui 25af02b1b467fcd53b63e0c6d6d324c57c16ef18, while the passive paint.ts constants retain the prior New York 02cad611 contract for independently owned compound commands. Direct default/outline/secondary/ghost/destructive/link paint follows the supported subset of the selected profile, including a transparent 1px border, background clipping, 14px/20px typography, focus ring 3px at ring/30, and source-specific hover/dark branches. The finite secondary hover is color-mix(in oklch, secondary, foreground 5%). No compound command, other family or historical API compatibility baseline is silently migrated.
      zh-CN: 此历史 criterion ID 现在明确两种归属：direct Button 采用固定 25af02b1 的 Rhea 默认与显式 Luma profile；paint.ts 仍保留独立 compound command 使用的旧 New York 02cad611 合同。direct 样式覆盖受支持 variant 子集、透明 1px 边框、14px/20px 字体、ring/30 与精确 hover/dark 分支；不迁移 compound、其他 family 或历史 API 兼容基线。
  - id: P-SHADCN-BUTTON-GHOST-NEW-YORK-PAINT
    text:
      en: 'The historical criterion ID remains stable, but direct Button ghost now follows the adopted Rhea/Luma source at 25af02b1: muted background and foreground text on hover, muted/50 in dark mode. The prior accent recipe belongs to the recorded New York history, not this profile. All inherited hover/disabled/variant/re-mount cleanup, live color-scheme re-evaluation, natural source collection and generated-consumer requirements remain unchanged. No test may keep accepting the obsolete accent value as an alternative.'
      zh-CN: 历史 criterion ID 保留，direct Button ghost 的当前来源为 25af02b1 Rhea/Luma：hover 使用 muted/foreground，dark 为 muted/50。旧 accent recipe 保留为历史，不能在新测试中作为兼容备选放行；继承状态、禁用/切换/卸载清理、实时主题更新与真实生成闭包要求不变。
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-BUTTON-UPSTREAM-IDENTITY
    text:
      zh-CN: Shadcn Button 必须明确标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现，并以固定 upstream revision/path 作为兼容比较基线；P 实体只治理 Proto UI 投射，不主张上游所有权或认证。
      en: Shadcn Button must identify itself as an unofficial Proto UI-maintained shadcn/ui-derived implementation and use a pinned upstream revision and path as its compatibility baseline; the P entity governs only the Proto UI projection and does not claim upstream ownership or endorsement.
  - id: P-SHADCN-BUTTON-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-button` 必须通过一等 `inherits.prototypes` 关系指向 `P-BASE-BUTTON`，并通过 `asButton()` 在 setup 期默认引入其 guarantee。上层原型允许对某个引入能力施加 setup-only 负向补丁或替代，但必须在自身准则中标明被放弃或改写的 Base 能力及替代语义；未声明偏离的 Base guarantee 保持有效。取消应在 setup 计划中完成，通常不为已取消能力留下 runtime 分支开销；不得用 runtime flag 伪装 setup 负向补丁。'
      en: '`shadcn-button` must point to `P-BASE-BUTTON` through the first-class `inherits.prototypes` relation and call `asButton()` to introduce its guarantees by default during setup. The upper-layer prototype may apply a setup-only negative patch or replacement to an introduced capability, but its own criteria must identify the abandoned or rewritten Base capability and the replacement semantics; every Base guarantee without a declared deviation remains effective. Cancellation should complete in the setup plan and normally leave no runtime branch cost for the canceled capability; a runtime flag must not masquerade as a setup-time negative patch.'
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            [
              P-BASE-BUTTON-ROLE-COMMAND,
              P-BASE-BUTTON-AUTHORING-ENTRIES,
              P-BASE-BUTTON-NO-VISUAL-VARIANT-CORE,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-BUTTON-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前 Shadcn Button 实现不对 `asButton()` 引入的 command role、activation、focus、disabled、a11y、state 或 outward signal 施加负向补丁；本实体新增的 props 与 style rules 是视觉/API 增量，不构成 Base 行为反转。
      en: The current Shadcn Button implementation applies no negative patch to the command role, activation, focus, disabled, accessibility, state, or outward signals introduced by `asButton()`; its added props and style rules are visual and API deltas rather than Base-behavior reversals.
  - id: P-SHADCN-BUTTON-DIRECT-ENTRY
    text:
      zh-CN: 当前 Shadcn Button protocol 以 `shadcn-button` direct prototype 公开，并透明保留 Button 内容 slot；本层不额外提供 authored asHook。
      en: The current Shadcn Button protocol is exposed as the `shadcn-button` direct prototype and transparently preserves Button content through its slot; this layer does not provide an additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003, C-TEMPLATE-0001]
  - id: P-SHADCN-BUTTON-VARIANT-PROP
    text:
      zh-CN: 当前 passing API 必须提供 `variant`，可选 default、destructive、outline、secondary、ghost、link，默认 default；每个值必须投射对应的 shadcn-style surface tokens，移除该 prop 必须恢复 default tokens。
      en: The current passing API must provide `variant` with default, destructive, outline, secondary, ghost, and link options and a default of default; each value must project its corresponding shadcn-style surface tokens, and removing the prop must restore the default tokens.
    dependsOn:
      contracts: [C-PROPS-0001, C-PROPS-0003, C-PROPS-0009, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-BUTTON-SIZE-PROP
    text:
      zh-CN: 当前 passing API 必须提供 `size`，可选 default、sm、lg、icon、icon-compact，默认 default；每个值必须投射对应的尺寸与间距 tokens，移除该 prop 必须恢复 default tokens。
      en: The current passing API must provide `size` with default, sm, lg, icon, and icon-compact options and a default of default; each value must project its corresponding size and spacing tokens, and removing the prop must restore the default tokens.
    dependsOn:
      contracts: [C-PROPS-0001, C-PROPS-0003, C-PROPS-0009, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-BUTTON-INTERACTION-STYLES
    text:
      zh-CN: Shadcn Button 必须从 inherited hovered、focusVisible、pressed 与 disabled state 派生 hover、focus ring、press offset 与 disabled visual rules；视觉 rule 不得成为另一套交互状态真相。
      en: Shadcn Button must derive hover, focus-ring, press-offset, and disabled visual rules from inherited hovered, focusVisible, pressed, and disabled state; visual rules must not become a second source of interaction-state truth.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-BUTTON
          anchors:
            [
              P-BASE-BUTTON-POINTER-HOVER,
              P-BASE-BUTTON-FOCUSABLE,
              P-BASE-BUTTON-PRESS-LIFECYCLE,
              P-BASE-BUTTON-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-BUTTON-COLOR-SCHEME-STYLES
    text:
      zh-CN: outline、destructive 与 ghost variant 必须能够通过 environment colorScheme meta 投射当前 dark-mode 增量；meta 只影响 visual intent，不改变 Button protocol facts。
      en: Outline, destructive, and ghost variants must project the current dark-mode deltas through environment colorScheme meta; meta affects visual intent only and does not change Button protocol facts.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
  - id: P-SHADCN-BUTTON-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已测试的 variant、size、disabled 与 style behavior；固定历史兼容比较基线与后来有意采用的官方 recipe 证据必须分开记录。对固定 baseline 的差异必须集中维护在唯一 compatibility open question 中，并区分 intentional deviation 与尚未实现的 parity gap；采用较新视觉 recipe 不得被解释为整体 compatibility baseline 前移或 current passing guarantee 扩大。
      en: This entity claims only the tested variant, size, disabled, and style behavior; the pinned historical compatibility baseline and evidence for later intentionally adopted official recipes must remain distinct. Every difference from the pinned baseline must be maintained in one centralized compatibility open question and classified as either an intentional deviation or an unimplemented parity gap; adopting a newer visual recipe must not be interpreted as advancing the overall compatibility baseline or widening the current passing guarantee.
  - id: P-SHADCN-BUTTON-AS-CHILD-OMISSION
    text:
      zh-CN: upstream `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 Shadcn Button API；透明保留 content slot 不得被宣称为 Radix Slot 或 `asChild` 等价实现。
      en: Upstream `asChild` is intentionally omitted from the Shadcn Button API under `D-AS-CHILD-OMISSION-0001`; transparently preserving the content slot must not be claimed as a Radix Slot or `asChild` equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
openQuestions:
  - id: P-SHADCN-BUTTON-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 固定的历史 shadcn/ui Button 兼容比较基线与后来有意采用的官方视觉 recipe 应如何同时记录，当前其余差异分别是有意偏离还是待实现 gap，以及待实现项应按什么顺序收敛？
      en: How should the pinned historical shadcn/ui Button compatibility baseline coexist with later intentionally adopted official visual recipes, which remaining differences are intentional deviations versus implementation gaps, and in what order should those gaps converge?
    context:
      zh-CN: >-
        固定的历史兼容比较基线仍是 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Button；它没有被静默前移。当前 destructive 的 `bg-destructive/10 text-destructive`、hover `bg-destructive/20`、dark `bg-destructive/20` / `dark:hover:bg-destructive/30` recipe 则是有意采用较新官方设计，稳定来源证据固定到 shadcn-ui/ui revision `1773ecfeeb4a04366978d353e69b5c7ded78dcb2` 的 `apps/v4/registry/styles/style-maia.css`。这一来源只解释当前视觉 recipe，不扩大整体 upstream parity claim。#454 的对比度实测保留为 adopted-upstream behavior evidence，不构成 Proto UI 意外 parity gap、本地 palette remediation requirement 或 Proto UI 自有的 4.5:1 guarantee。


      en: >-
        The pinned historical compatibility baseline remains the v4 new-york Button at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; it has not been silently advanced. The current destructive recipe—`bg-destructive/10 text-destructive`, hover `bg-destructive/20`, dark `bg-destructive/20`, and `dark:hover:bg-destructive/30`—is instead an intentional adoption of a later official design, with stable source evidence pinned to shadcn-ui/ui revision `1773ecfeeb4a04366978d353e69b5c7ded78dcb2` at `apps/v4/registry/styles/style-maia.css`. That source explains the current visual recipe only and does not widen the overall upstream parity claim. The measured contrast from #454 is retained as adopted-upstream behavior evidence; it is not an accidental Proto UI parity gap, a local palette remediation requirement, or a Proto UI-owned 4.5:1 guarantee. The decided intentional deviation still includes omission of `asChild`, and the transparent slot is not a Radix Slot equivalent. Current implementation or review gaps include at least className and native-button prop forwarding, aria-invalid styling, nested-SVG sizing, xs/icon-xs/icon-sm/icon-lg sizes, and exact differences between current size and other visual tokens and the pinned baseline. The current passing guarantee must not expand until an item is implemented and tested.


    blocks: ['activation:P-SHADCN-BUTTON']
