revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced the delta-style Shadcn Button catalog template with reversible Base inheritance, pinned upstream identity, current visual API guarantees, intentional asChild omission, and centralized compatibility differences.
  - version: 0.3.0-alpha.0
    change: revised
    summary: Distinguished the pinned historical compatibility baseline from the later intentionally adopted destructive visual recipe and retained contrast as adopted-upstream evidence.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Adopted the confirmed PR 872 New York sizing and reusable passive default/outline paint without changing Base ownership, the opt-in wrapping extension, or the separate destructive recipe.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added bounded pinned New York ghost hover and dark-meta paint with source-collected consumer closure; historical API baseline and other variant boundaries remain unchanged.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added an explicit Proto icon-compact presentation size for the pinned Blocks size-7 consumer without claiming upstream icon-sm parity or changing Base ownership and existing defaults.
tags: [prototype, shadcn, button, upstream-derived, delta, compatibility, visual]
