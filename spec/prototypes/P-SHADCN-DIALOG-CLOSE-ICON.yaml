id: P-SHADCN-DIALOG-CLOSE-ICON
type: prototype
title: Shadcn Dialog CloseIcon is the independent default X close surface
status: draft
since: 0.2.0-rc.3
summary: CloseIcon inherits Base close-command semantics and adds the accessible X surface used by the Dialog Content preset.
statement:
  zh-CN: Shadcn Dialog CloseIcon 是独立的交互 prototype，继承 Base Dialog Close command，投射带 `Close` accessible name 的 X icon surface，并作为 CLI Dialog Content preset 的可替换默认 part；它不是 Content 内部隐藏实例。
  en: Shadcn Dialog CloseIcon is an independent interaction prototype that inherits the Base Dialog Close command, projects an X icon surface with the accessible name `Close`, and serves as the replaceable default part of the CLI Dialog Content preset; it is not a hidden Content-internal instance.
criteria:
  - id: P-SHADCN-DIALOG-CLOSE-ICON-BASE-INHERITANCE
    text:
      zh-CN: CloseIcon 必须调用 `asDialogClose()` 并保留 close request、disabled、focus 与 a11y command semantics。
      en: CloseIcon must call `asDialogClose()` and retain close-request, disabled, focus, and accessibility command semantics.
  - id: P-SHADCN-DIALOG-CLOSE-ICON-SURFACE
    text:
      zh-CN: CloseIcon 必须投射 X icon、`Close` accessible name 以及包含可见 focus-visible ring 的独立 state-driven visual feedback，并按固定 upstream baseline 使用 `top-4 right-4` 放置其 16px X surface。
      en: CloseIcon must project an X icon, the accessible name `Close`, and independent state-driven visual feedback including a visible focus-visible ring, positioning its 16px X surface at `top-4 right-4` under the pinned upstream baseline.
  - id: P-SHADCN-DIALOG-CLOSE-ICON-PRESET
    text:
      zh-CN: Prototype library 必须在 Dialog 组件目录的 preset recipe 中声明 Content/CloseIcon identity、`direct-child` placement 与替换策略，并通过 `component-presets` 聚合 surface 提供给 CLI。CLI Content preset 在未提供 close 时物化 CloseIcon，并允许兼容替换或显式关闭，同时保留 raw Content facade；recipe 不得声明视觉 tokens。CloseIcon 只能在 Dialog parent context 已建立后连接，禁止以 `CONTEXT_PROVIDER_MISSING` 失败后重挂载来恢复。
      en: The prototype library must declare Content and CloseIcon identity, `direct-child` placement, and replacement policy in a preset recipe colocated with the Dialog component and expose it through the aggregate `component-presets` surface. The CLI Content preset materializes CloseIcon when no close is provided, allows compatible replacement or explicit omission, and retains a raw Content facade; the recipe must not declare visual tokens. CloseIcon may connect only after its Dialog parent context exists and must not recover from `CONTEXT_PROVIDER_MISSING` by remounting.
    dependsOn:
      decisions:
        - id: D-COMPONENT-PRESET-MATERIALIZATION-0001
          since: 0.2.0-rc.3
