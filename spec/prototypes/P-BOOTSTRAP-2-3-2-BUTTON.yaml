    summary: Cataloged the draft Base-inheriting visual Button foundation with explicit material, release and host limits.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Replaced the original scalable-metrics deviation with fixed upstream pixel units under the PR872 sizing decision; default/primary scope and draft lifecycle remain unchanged.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added default/large/small/mini sizes with exclusive upstream pixel dimensions, preserving default compatibility, Base ownership, two variants and draft lifecycle.
