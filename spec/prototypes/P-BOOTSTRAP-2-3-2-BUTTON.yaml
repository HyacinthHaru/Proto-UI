id: P-BOOTSTRAP-2-3-2-BUTTON
type: prototype
title: Bootstrap 2.3.2 Button projection over Base Button
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: A user-directed, independently authored visual foundation. Full family/component coverage, material capability where applicable, generated/native evidence and stable admission remain open; source package availability is not release or conformance admission.
summary: At default size, the default/primary Button uses the archived 2.3.2 vertical gradient and raised/inset shadow grammar, 4px corners, normal weight, fixed 4px 12px padding and 14px/20px typography independent of root font size. Stronger focus ring, omitted text-shadow/border-bottom tint/animated gradient and absent other variants are documented differences. The legacy palette is retained in both host color schemes.
statement:
  en: At default size, the default/primary Button uses the archived 2.3.2 vertical gradient and raised/inset shadow grammar, 4px corners, normal weight, fixed 4px 12px padding and 14px/20px typography independent of root font size. Stronger focus ring, omitted text-shadow/border-bottom tint/animated gradient and absent other variants are documented differences. The legacy palette is retained in both host color schemes. variant is default | primary, default default; size is default | large | small | mini, default default; disabled is inherited and defaults false.
criteria:
  - id: P-BOOTSTRAP-2-3-2-BUTTON-BASE
    text:
      en: The Prototype invokes asButton() once, preserves inherited interaction, focus, disabled and click ownership, and consumes only its exposed state handles for visual Rules.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-API
    text:
      en: variant is default | primary, default default; size is default | large | small | mini, default default; disabled is inherited and defaults false. Removing a prop restores its default. Size Rules are mutually exclusive and retain the same Base interaction owner.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-VISUAL
    text:
      en: At default size, the default/primary Button uses the archived 2.3.2 vertical gradient and raised/inset shadow grammar, 4px corners, normal weight, fixed 4px 12px padding and 14px/20px typography independent of root font size. Stronger focus ring, omitted text-shadow/border-bottom tint/animated gradient and absent other variants are documented differences. The legacy palette is retained in both host color schemes.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
    text:
      en: Both variants retain fixed v2.3.2 CSS pixel units at root font sizes 16px and 32px. Every size has line height 20px and border 1px. Default has padding 4px 12px, font 14px, radius 4px and single-line height 30px; large has 11px 19px, 17.5px, 6px and 44px; small has 2px 10px, 11.9px, 3px and 26px; mini has 0px 6px, 10.5px, 3px and 22px. Size-dependent padding, font and radius Rules are mutually exclusive. Root-font changes are not browser zoom.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-CLOSURE
    text:
      en: Appearance is authored in feedback tokens and state/prop Rules; every token has an explicit physical translation. Standalone Web output must not depend on website component CSS or reset rules.
  - id: P-BOOTSTRAP-2-3-2-BUTTON-BOUNDARY
    text:
      en: The package is private and unreleased. Initial source and Web evidence do not establish general Prototype Compiler, GPUI, Flutter or Qt support. Homepage and full component coverage remain separate work.
