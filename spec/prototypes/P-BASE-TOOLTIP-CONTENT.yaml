id: P-BASE-TOOLTIP-CONTENT
type: prototype
title: Base Tooltip Content is a transitional positioned description surface
status: draft
since: 0.2.0-rc.7
summary: Content derives Root visibility through non-modal Overlay and Transition, owns renderer portaling and anchored positioning, bridges hover, and dismisses on Escape.
statement:
  en: Content is the optional supplementary description surface under Portal anatomy. It projects tooltip role and Root-owned stable identity, derives visibility from Root open, owns non-modal Overlay plus Transition presence, portals and positions itself against Trigger, extends the pointer bridge, and routes Escape dismissal back to Root. It does not move focus or dismiss on outside interaction.
  zh-CN: Content 是 Portal anatomy 下可选的 supplementary description surface。它投射 tooltip role 与 Root-owned 稳定 identity，从 Root open 派生 visibility，持有 non-modal Overlay 与 Transition presence，以 Trigger 为 anchor 完成自身 portaling/positioning，延续 pointer bridge，并把 Escape dismissal 路由回 Root；它不移动焦点，也不因 outside interaction dismiss。
criteria:
  - id: P-BASE-TOOLTIP-CONTENT-OVERLAY-PRESENCE
    text:
      en: Content must derive open from Root, bind non-modal Overlay presence through Transition, use fixed Trigger-anchored renderer portaling, and accept side, align, offsets, collision avoidance, and collision padding props.
      zh-CN: Content 必须从 Root 派生 open，通过 Transition 绑定 non-modal Overlay presence，以 fixed、Trigger-anchored renderer portaling 投射，并接受 side、align、offset、collision avoidance 与 collision padding props。
  - id: P-BASE-TOOLTIP-CONTENT-HOVER-BRIDGE
    text:
      en: Content pointer enter must keep Tooltip open through Root interaction intent, and pointer leave must permit the configured close delay.
      zh-CN: Content pointer enter 必须通过 Root interaction intent 保持 Tooltip open，pointer leave 必须允许按配置 close delay 关闭。
  - id: P-BASE-TOOLTIP-CONTENT-A11Y
    text:
      en: Materialized Content must project role tooltip and the stable Root-published Content id referenced by Trigger describedBy.
      zh-CN: Materialized Content 必须投射 role tooltip，以及 Trigger describedBy 引用的 Root-published 稳定 Content id。
  - id: P-BASE-TOOLTIP-CONTENT-ESCAPE
    text:
      en: Global Escape while open must close Overlay and enter Root's openChange request channel; controlled mode must preserve owner open.
      zh-CN: open 时 global Escape 必须关闭 Overlay 并进入 Root openChange request channel；controlled mode 必须保留 owner open。
  - id: P-BASE-TOOLTIP-CONTENT-NON-MODAL
    text:
      en: Content must not trap, enter, or restore focus and must not dismiss on outside press or focus outside.
      zh-CN: Content 不得 trap、enter 或 restore focus，也不得因 outside press 或 focus outside dismiss。
