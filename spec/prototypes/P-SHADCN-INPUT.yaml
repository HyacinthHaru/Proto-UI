revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added the Shadcn Input projection with inherited Base protocol, static selection styling, and a documented, evidence-bounded visual subset.
tags: [prototype, shadcn, input, root, upstream-derived, delta, compatibility, visual]
