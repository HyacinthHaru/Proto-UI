id: P-SHADCN-INPUT
type: prototype
title: Shadcn Input Root inherits Base Input and adds its expressible visual subset
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  zh-CN: >-
    初始保持 draft：该投射刚建立，当前声明的是固定 Shadcn v4 new-york Input 基线中可由 Proto UI style channel 表达并已有可执行证据的子集；placeholder、responsive 与 invalid 呈现等兼容差异仍需逐项评审和验证，因此尚未形成完整、稳定的投射保证。

  en: >-
    Initial status is draft because this projection is newly established and currently declares only the subset of the pinned Shadcn v4 new-york Input baseline that Proto UI's style channel can express with executable evidence. Placeholder, responsive, and invalid presentation differences still require individual review and verification, so the projection is not yet a complete stable guarantee.

summary: Shadcn Input Root is an unofficial visual projection over the host-mediated Base Input protocol and deliberately exposes only the verified presentation subset.
statement:
  zh-CN: >-
    Shadcn Input Root 是 `P-BASE-INPUT` 之上的非官方设计语言投射。它消费 `asInputRoot()`，保留单一 host-owned single-line editor 及其 value、event、IME、native props、accessibility 与 focus/blur 协议，只为可继承的 value、focusVisible、disabled state 和 dark colorScheme 增加已验证的呈现增量。兼容基线固定为 shadcn-ui/ui v4 new-york revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`；不可表达或没有 Base 语义支撑的上游变体均明确记录为差异，不由本实体虚构。

  en: >-
    Shadcn Input Root is an unofficial design-language projection over `P-BASE-INPUT`. It consumes `asInputRoot()`, preserves the single host-owned single-line editor and its value, event, IME, native-prop, accessibility, and focus/blur protocol, and adds only verified presentation deltas for inherited value, focusVisible, disabled state, and dark colorScheme. Its compatibility baseline is shadcn-ui/ui v4 new-york at revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; upstream variants that are inexpressible or unsupported by Base semantics are recorded as differences rather than invented by this entity.

criteria:
  - id: P-SHADCN-INPUT-UPSTREAM-IDENTITY
    text:
      zh-CN: Shadcn Input 必须标记为 Proto UI 维护的非官方投射并固定 upstream revision/path；本实体不声称 shadcn/ui 所有权或认证。
      en: Shadcn Input must identify itself as an unofficial Proto UI-maintained projection and pin the upstream revision and path; this entity claims neither shadcn/ui ownership nor endorsement.
  - id: P-SHADCN-INPUT-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-input-root` 必须继承 `P-BASE-INPUT`，复用其 frozen Text Control requirement 并调用 `asInputRoot()`；不得通过 setup-only negative patch 放弃或改写 Base guarantee。'
      en: '`shadcn-input-root` must inherit `P-BASE-INPUT`, reuse its frozen Text Control requirement, and call `asInputRoot()`; it must not abandon or rewrite a Base guarantee through a setup-only negative patch.'
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors:
            [
              P-BASE-INPUT-PHYSICAL-TARGET,
              P-BASE-INPUT-VALUE-OWNERSHIP,
              P-BASE-INPUT-A11Y-AND-FOCUS,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-INPUT-BASE-GUARANTEES
    text:
      zh-CN: 投射必须保留 Base Input 的 controlled/uncontrolled value、归一化事件与 IME、live native text props、textbox 命名/描述、disabled/readOnly 以及 focus/blur，不增加第二个编辑器或 renderer。
      en: The projection must preserve Base Input controlled/uncontrolled value, normalized events and IME, live native text props, textbox naming/description, disabled/readOnly, and focus/blur without adding a second editor or renderer.
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors:
            [
              P-BASE-INPUT-VALUE-OWNERSHIP,
              P-BASE-INPUT-EVENTS-AND-IME,
              P-BASE-INPUT-NATIVE-PROPS,
              P-BASE-INPUT-A11Y-AND-FOCUS,
            ]
  - id: P-SHADCN-INPUT-DIRECT-ENTRY
    text:
      zh-CN: 当前投射以单一 direct Root `shadcn-input-root` 公开，不新增 authored asHook 或 anatomy part。
      en: The current projection is exposed as the single direct Root `shadcn-input-root`; it adds no authored asHook or anatomy part.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-INPUT-VISUAL-SURFACE
    text:
      zh-CN: Root 必须投射 `h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none` 与静态文本选择 token `selection:bg-primary selection:text-primary-foreground` 这一经过验证的 Shadcn v4 new-york 呈现子集；不得把该子集表述为与 upstream 完全一致。
      en: The Root must project the verified Shadcn v4 new-york presentation subset `h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground`; it must not claim exact upstream parity.
    dependsOn:
      contracts:
        [C-RULE-INTENT-FEEDBACK-STYLE-0001, C-PROTOTYPE-STYLE-CLOSURE-0001, C-FEEDBACK-STYLE-0004]
  - id: P-SHADCN-INPUT-SELECTION-PRESENTATION
    text:
      zh-CN: 原生文本选择必须使用 upstream 对应的 primary 背景色与 primary-foreground 文字色；这只改变浏览器 selection pseudo-element 的静态视觉样式，不增加 selection API 或编辑状态所有权。
      en: Native text selection must use the corresponding upstream primary background and primary-foreground text colors; this changes only the static visual style of the browser selection pseudo-element and adds no selection API or editing-state ownership.
    dependsOn:
      contracts: [C-FEEDBACK-STYLE-0004]
  - id: P-SHADCN-INPUT-STATE-PRESENTATION
    text:
      zh-CN: Focus ring `border-ring ring-ring/50 ring-3` 必须由继承的 `focusVisible` state 驱动；disabled treatment `pointer-events-none cursor-not-allowed opacity-50` 必须由继承的 `disabled` state 驱动；dark input surface `bg-input/30` 必须由 host colorScheme metadata 驱动。不得建立第二套状态 truth 或仅由 aria 属性伪造 Base 未拥有的状态。
      en: The focus ring `border-ring ring-ring/50 ring-3` must be driven by inherited `focusVisible`; the disabled treatment `pointer-events-none cursor-not-allowed opacity-50` must be driven by inherited `disabled`; and the dark input surface `bg-input/30` must be driven by host colorScheme metadata. The projection must not create another state truth or fabricate states Base does not own from ARIA attributes.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors: [P-BASE-INPUT-A11Y-AND-FOCUS]
  - id: P-SHADCN-INPUT-CONTENTLESS
    text:
      zh-CN: 投射 renderer 必须返回 null；caller children 不得成为第二个编辑面或额外 physical control。
      en: The projection renderer must return null; caller children must not become a second editing surface or additional physical control.
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors: [P-BASE-INPUT-PHYSICAL-TARGET, P-BASE-INPUT-BOUNDARY]
  - id: P-SHADCN-INPUT-BOUNDARY
    text:
      zh-CN: 投射不得添加 arbitrary native type、form/submit、validation/invalid、search/send command、selection API、第二 editor、authored content renderer 或 non-Web host conformance claim。
      en: The projection must not add arbitrary native types, form/submit, validation/invalid, search/send commands, selection APIs, a second editor, an authored-content renderer, or a non-Web host conformance claim.
    references:
      prototypes:
        - id: P-BASE-INPUT
          anchors: [P-BASE-INPUT-BOUNDARY]
  - id: P-SHADCN-INPUT-COMPATIBILITY-SUBSET
    text:
      zh-CN: 实体只声明当前已实现且有可执行证据的呈现及继承协议；相对固定 upstream baseline 的物质差异集中于唯一 compatibility open question，并区分 intentional deviation 与未实现 parity gap。
      en: The entity claims only presentation and inherited behavior currently implemented with executable evidence; every material difference from the pinned upstream baseline is centralized in one compatibility open question and classified as an intentional deviation or an unimplemented parity gap.
openQuestions:
  - id: P-SHADCN-INPUT-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相对固定 Shadcn Input baseline，placeholder、responsive text size、aria-invalid、data-slot 与 className forwarding 等差异应维持为有意偏离还是另行补足？
      en: Against the pinned Shadcn Input baseline, should differences in placeholder, responsive text size, aria-invalid, data-slot, and className forwarding remain intentional deviations or be addressed separately?
    context:
      zh-CN: >-
        `C-FEEDBACK-STYLE-0004` 只允许 `selection:` 静态 pseudo-element variant；placeholder、responsive、aria-invalid、data-slot 与 className forwarding 仍不在当前投射范围。Focus/disabled/dark 分别使用继承 state 或 host metadata rule。Base Input 不拥有 invalid state，调用者也没有 className/data-slot API。该 open question 不扩大 Base 语义；若任何跟进要求改变 Base ownership，必须单独决策。

      en: >-
        `C-FEEDBACK-STYLE-0004` allows only the static `selection:` pseudo-element variant; placeholder, responsive, aria-invalid, data-slot, and className forwarding remain outside this projection. Focus, disabled, and dark are handled through inherited state or host-metadata rules. Base Input owns no invalid state, and the caller API exposes neither className nor data-slot. This question does not expand Base semantics; any follow-up that requires changing Base ownership needs a separate decision.

    blocks: [activation:P-SHADCN-INPUT]
sources:
  - path: packages/prototypes/shadcn/src/input/root.proto.ts
  - path: packages/prototypes/shadcn/src/input/types.ts
  - path: packages/prototypes/shadcn/test/input.test.ts
  - path: https://github.com/shadcn-ui/ui/blob/f31ed81983653919dd4fe77aee4b4859f610f1dc/apps/v4/registry/new-york-v4/ui/input.tsx
    label: shadcn/ui v4 new-york Input pinned baseline
dependsOn:
  contracts:
    [
      C-AS-HOOK-0001,
      C-CORE-SYNTAX-0003,
      C-CORE-SYNTAX-0007,
      C-PROTOTYPE-STYLE-CLOSURE-0001,
      C-RULE-WHEN-0002,
      C-RULE-INTENT-FEEDBACK-STYLE-0001,
      C-FEEDBACK-STYLE-0004,
    ]
  decisions: [D-PROTOTYPE-ENTITY-NAMING-0001]
inherits:
  prototypes:
    - id: P-BASE-INPUT
      note: Default inherited text-control protocol; this projection adds presentation only and applies no negative patch.
verifies:
