id: P-BRUTALIST-SCROLL-AREA
type: prototype
title: Brutalist Scroll Area protocol
status: draft
since: 0.2.0-rc.7
summary: Consumer-sized Neo-Brutalist visual shell over Base Scroll Area anatomy.
statement:
  en: Brutalist Scroll Area preserves the five-part Base shell and adds only square paper geometry and positioned Lavender/ink controls. It does not own portable viewport metrics or thumb dragging.
  zh-CN: Brutalist Scroll Area 保留五 part Base shell，只增加方形 paper geometry 与定位后的 Lavender/ink controls；不拥有可移植 viewport metrics 或 thumb 拖拽。
criteria:
  - id: P-BRUTALIST-SCROLL-AREA-BASE-INHERITANCE
    text:
      en: Every part invokes its corresponding Base Scroll Area as-hook and adds no metrics, scroll synchronization, drag behavior, focus, or events.
      zh-CN: 每个 part 调用对应 Base Scroll Area as-hook，且不新增 metrics、scroll synchronization、drag 行为、focus 或 event。
  - id: P-BRUTALIST-SCROLL-AREA-VISUAL-SHELL
    text:
      en: Root fills a consumer-sized host and clips overflow; Viewport fills Root and owns native overflow; vertical and horizontal Scrollbars are positioned on the right and bottom edges; Corner occupies the bottom-right 1rem square; all geometry remains square and flat.
      zh-CN: Root 填满 consumer 提供尺寸的 host 并裁剪 overflow；Viewport 填满 Root 并拥有 native overflow；纵向与横向 Scrollbar 分别定位在右侧与底侧；Corner 占据右下角 1rem 方块；所有 geometry 保持方角和平涂。
sources:
  - path: packages/prototypes/brutalist/src/scroll-area/root.proto.ts
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Introduced brutalist scroll area  protocol.
tags:
