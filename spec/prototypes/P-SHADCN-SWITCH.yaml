      note: Default inherited protocol; explicit setup-time negative-patch criteria may override individual guarantees.
verifies: { tests: [T-SHADCN-SWITCH-0001] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Introduced delta-style Shadcn Switch Root cataloging with Base inheritance, current visual guarantees, intentional asChild omission, and centralized upstream differences.
  - version: 0.2.0-rc.3
    change: expanded
    summary: Added a CLI-materialized convenience preset with replaceable or omittable default Thumb while preserving raw facades.
  - version: 0.2.0-rc.5
    change: revised
    summary: Moved checked position changes from asymmetric Root padding to the Thumb's inherited checked-state translation and required context-safe preset mounting.
tags: [prototype, shadcn, switch, root, upstream-derived, delta, compatibility, visual]
