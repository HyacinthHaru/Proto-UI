id: P-SHADCN-SWITCH
type: prototype
title: Shadcn Switch Root inherits Base Switch and adds the current track surface
status: draft
since: 0.2.0-rc.0
summary: Shadcn Switch Root is an unofficial Proto UI-maintained projection that inherits Base Switch root semantics and adds the currently implemented shadcn-style track and state-driven visual surface.
statement:
  zh-CN: >-
    Shadcn Switch Root 是 `P-BASE-SWITCH` 之上的 direct prototype，保留 Base Switch 的 on/off value、activation、focus、disabled、a11y、context 与 `checkedChange` signal，并增加当前实现的 track 尺寸、形状、颜色和交互反馈。兼容比较基线固定到 shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc` 的 v4 new-york Switch；`asChild` 明确不提供，其他差异统一记录为 compatibility differences。


  en: >-
    Shadcn Switch Root is a direct prototype over `P-BASE-SWITCH`. It retains Base Switch on/off value, activation, focus, disabled, accessibility, context, and the `checkedChange` signal while adding the currently implemented track dimensions, shape, color, and interaction feedback. Its compatibility baseline is the v4 new-york Switch at shadcn-ui/ui revision `f31ed81983653919dd4fe77aee4b4859f610f1dc`; `asChild` is explicitly unavailable, and all other divergences are tracked as compatibility differences.


criteria:
  - id: P-SHADCN-SWITCH-UPSTREAM-IDENTITY
    text:
      zh-CN: Shadcn Switch 必须标记为 Proto UI 维护的非官方 shadcn/ui 衍生实现，并固定 upstream revision/path；本实体只治理 Proto UI 投射，不主张上游所有权或认证。
      en: Shadcn Switch must identify itself as an unofficial Proto UI-maintained shadcn/ui-derived implementation and pin its upstream revision and path; this entity governs only the Proto UI projection and claims neither upstream ownership nor endorsement.
  - id: P-SHADCN-SWITCH-BASE-INHERITANCE
    text:
      zh-CN: '`shadcn-switch-root` 必须通过 `inherits.prototypes` 指向 `P-BASE-SWITCH`，并通过 `asSwitchRoot()` 默认引入其 guarantee；若以 setup-only 负向补丁放弃或改写 Base 能力，必须在本实体中声明具体偏离和替代语义。'
      en: '`shadcn-switch-root` must point to `P-BASE-SWITCH` through `inherits.prototypes` and call `asSwitchRoot()` to introduce its guarantees by default; any setup-only negative patch that abandons or rewrites a Base capability must declare the exact deviation and replacement semantics in this entity.'
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-AUTHORING-ENTRIES,
              P-BASE-SWITCH-ROOT-SEMANTIC-OWNER,
              P-BASE-SWITCH-NO-VISUAL-VARIANT-CORE,
            ]
    dependsOn:
      contracts: [C-AS-HOOK-0001, C-CORE-SYNTAX-0007]
  - id: P-SHADCN-SWITCH-CURRENT-BASE-DEVIATIONS
    text:
      zh-CN: 当前实现不对 `asSwitchRoot()` 引入的 value、activation、focus、disabled、a11y、context、interaction state 或 outward signal 施加负向补丁；新增 style rules 仅构成视觉增量。
      en: The current implementation applies no negative patch to value, activation, focus, disabled, accessibility, context, interaction state, or outward signals introduced by `asSwitchRoot()`; its added style rules are visual deltas only.
  - id: P-SHADCN-SWITCH-DIRECT-ENTRY
    text:
      zh-CN: 当前 Root protocol 以 `shadcn-switch-root` direct prototype 公开；本层不额外提供 authored asHook。
      en: The current Root protocol is exposed as the `shadcn-switch-root` direct prototype; this layer provides no additional authored asHook.
    dependsOn:
      contracts: [C-CORE-SYNTAX-0003]
  - id: P-SHADCN-SWITCH-CURRENT-VISUAL-SURFACE
    text:
      zh-CN: Root 必须提供当前已实现的 track 尺寸、圆角、边框、阴影、transition 与 unchecked surface，并以 canonical `px-0.5` 保持对称内边距；Thumb 位移不得依赖切换 Root padding。Web 物理 CSS 必须在宿主没有全局 reset 时仍以 scoped border-box 保持声明的外部尺寸。这些 tokens 是当前 passing surface，不表示与 upstream 精确一致。
      en: Root must provide the currently implemented track dimensions, radius, border, shadow, transition, and unchecked surface with symmetric canonical `px-0.5` padding; Thumb movement must not depend on switching Root padding. Web physical CSS must preserve the declared outer dimensions through a scoped border-box baseline when the host has no global reset. These tokens form the current passing surface and do not imply exact upstream parity.
    dependsOn:
      contracts: [C-RULE-INTENT-FEEDBACK-STYLE-0001]
      decisions:
        - id: D-WEB-STYLE-BASELINE-0001
          since: 0.2.0-rc.1
  - id: P-SHADCN-SWITCH-STATE-DRIVEN-STYLES
    text:
      zh-CN: checked、hovered、pressed、focusVisible、disabled 与 colorScheme 视觉 rule 必须从 inherited Switch state 或 host meta 派生，不得建立第二套 checked 或 interaction truth。
      en: Visual rules for checked, hovered, pressed, focusVisible, disabled, and colorScheme must derive from inherited Switch state or host metadata and must not establish a second checked or interaction source of truth.
    dependsOn:
      contracts: [C-RULE-WHEN-0002, C-RULE-INTENT-FEEDBACK-STYLE-0001]
    references:
      prototypes:
        - id: P-BASE-SWITCH
          anchors:
            [
              P-BASE-SWITCH-CHECKED-EXPOSE,
              P-BASE-SWITCH-POINTER-HOVER,
              P-BASE-SWITCH-PRESS-LIFECYCLE,
              P-BASE-SWITCH-FOCUSABLE,
              P-BASE-SWITCH-DISABLED-EXPOSE,
            ]
  - id: P-SHADCN-SWITCH-COMPATIBILITY-SUBSET
    text:
      zh-CN: 当前实体只声明已实现并测试的 inherited behavior、Root/Thumb 协作和视觉 surface；相对固定 upstream baseline 的全部差异必须集中在唯一 compatibility open question，并区分 intentional deviation 与 parity gap。
      en: This entity claims only implemented and tested inherited behavior, Root/Thumb coordination, and visual surface; every difference from the pinned upstream baseline must be centralized in one compatibility open question and classified as an intentional deviation or parity gap.
  - id: P-SHADCN-SWITCH-AS-CHILD-OMISSION
    text:
      zh-CN: upstream Root props 中的 `asChild` 依 `D-AS-CHILD-OMISSION-0001` 有意不进入 API，任何元素投射或事件组合均不得被宣称为 Radix Slot 等价实现。
      en: The `asChild` member of upstream Root props is intentionally omitted under `D-AS-CHILD-OMISSION-0001`; no element projection or event composition may be claimed as a Radix Slot equivalent.
    dependsOn:
      decisions: [D-AS-CHILD-OMISSION-0001]
  - id: P-SHADCN-SWITCH-COMPONENT-PRESET
    text:
      zh-CN: Prototype library 必须在 `component-presets` surface 声明 Root/Thumb identity 与替换策略，CLI 只消费受检查的生成投影并在保留 raw Root/Thumb facades 的同时生成 `ShadcnSwitch` convenience preset；未提供 Thumb 时物化一个同适配器默认 Thumb，显式兼容 Thumb 必须替换默认值，显式关闭必须不物化 Thumb，且所有候选解析必须先于该 part 挂载并在 Root context 已建立后连接。Preset recipe 不得声明或覆盖视觉 tokens。
      en: The prototype library must declare Root and Thumb identity and replacement policy through its `component-presets` surface, while the CLI consumes only a checked generated projection and generates the `ShadcnSwitch` convenience preset alongside raw Root and Thumb facades. An absent Thumb materializes one same-adapter default Thumb, an explicit compatible Thumb replaces it, explicit omission materializes no Thumb, and all candidates must resolve before that part mounts and connect after the Root context exists. The preset recipe must neither declare nor override visual tokens.
    dependsOn:
      decisions:
        - id: D-COMPONENT-PRESET-MATERIALIZATION-0001
          since: 0.2.0-rc.3
openQuestions:
  - id: P-SHADCN-SWITCH-Q-UPSTREAM-DIFFERENCES
    question:
      zh-CN: 相较固定 shadcn/ui Switch baseline，当前全部差异分别是有意偏离还是待实现 gap，应按什么顺序收敛？
      en: Against the pinned shadcn/ui Switch baseline, which current differences are intentional deviations versus implementation gaps, and in what order should the gaps converge?
    context:
      zh-CN: >-
        已确定的 intentional deviation 是不提供 `asChild`。CLI 已用可替换默认 Thumb preset 映射 upstream 单一 `Switch` wrapper，同时保留 raw Root/Thumb facades。待实现或待评审差异至少包括 `size: sm | default`、`onCheckedChange` 相对 `checkedChange` signal、className/native prop forwarding、data-slot/data-size、form props，以及当前尺寸、hover/press、focus ring、disabled cursor、dark surface、transition 和 shadow tokens 的精确差异；checked 位移已经改为由 Thumb 自身的 inherited state 驱动。这些项目通过实现与测试前不得扩大 passing guarantee。


      en: >-
        The decided intentional deviation is omission of `asChild`. The CLI now maps the upstream single `Switch` wrapper through a replaceable default-Thumb preset while retaining raw Root and Thumb facades. Remaining implementation or review gaps include `size: sm | default`; `onCheckedChange` versus the `checkedChange` signal; className and native prop forwarding; data-slot and data-size; form props; and exact differences in dimensions, hover and press behavior, focus ring, disabled cursor, dark surface, transition, and shadow tokens. Checked movement is now driven by the Thumb's own inherited state. The passing guarantee must not expand until an item is implemented and tested.


    blocks: [shadcn switch parity roadmap]
