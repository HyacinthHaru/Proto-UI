id: P-BASE-DROPDOWN-MENU-TRIGGER
type: prototype
title: Base Dropdown Menu Trigger is an accessible menu-button command
status: draft
since: 0.2.0-rc.0
summary: Trigger is a button-like command that projects popup relationships and requests menu opening with keyboard-specific entry intent.
statement:
  zh-CN: Dropdown Menu Trigger 是 Root 同域中至多一个的 menu-button command。它发布 host-neutral button、expanded、has-popup 与 controls semantics；pointer/Enter/Space 请求 toggle 或 open，ArrowDown 请求打开并进入首项，ArrowUp 请求打开并进入末项。Trigger 只提交 Root request，不持有 Content visibility 或 dismissal policy。
  en: Dropdown Menu Trigger is the optional, at-most-one menu-button command in the Root domain. It publishes host-neutral button, expanded, has-popup, and controls semantics; pointer, Enter, and Space request toggle or open, ArrowDown requests opening at the first item, and ArrowUp requests opening at the last item. Trigger only submits Root requests and owns neither Content visibility nor dismissal policy.
criteria:
  - id: P-BASE-DROPDOWN-MENU-TRIGGER-TRANSIENT-CLEANUP
    text:
      zh-CN: 'press.cancel、pointer.cancel 与 view unmount 必须清除本 part 的 hovered/pressed；清理不得改变 canonical Root open 或发出 activation/request。逻辑实例 remount 不得重放旧瞬态；pointer.leave 的语义清理不等于取消 Host 持有的 contact。'
      en: "press.cancel, pointer.cancel and view unmount must clear this part's hovered/pressed without changing canonical Root open or emitting activation/requests. Logical-instance remount must not replay stale transient state; semantic pointer.leave cleanup does not cancel a Host-owned contact."
    dependsOn:
      contracts: [C-EVENT-TYPE-0002, C-LIFECYCLE-0008]
  - id: P-BASE-DROPDOWN-MENU-TRIGGER-AUTHORING-ENTRIES
    text:
      zh-CN: '`base-dropdown-trigger` 与 `asDropdownTrigger` 必须是同一 Trigger protocol 的 authoring entries。'
      en: '`base-dropdown-trigger` and `asDropdownTrigger` must be authoring entries for the same Trigger protocol.'
  - id: P-BASE-DROPDOWN-MENU-TRIGGER-COMMAND
    text:
      zh-CN: Trigger 必须提供 button-like press、focus、hover、pressed 与 disabled 行为，但不得消费 Base Button prototype。
      en: Trigger must provide button-like press, focus, hover, pressed, and disabled behavior without consuming the Base Button prototype.
  - id: P-BASE-DROPDOWN-MENU-TRIGGER-A11Y
    text:
      zh-CN: Trigger 必须投射 button role、content-derived name、disabled、expanded、hasPopup=menu 与指向 Content identity 的 controls relation。
      en: Trigger must project a button role, content-derived name, disabled, expanded, hasPopup=menu, and a controls relation targeting Content identity.
  - id: P-BASE-DROPDOWN-MENU-TRIGGER-REQUEST
    text:
      zh-CN: enabled Trigger 的 pointer/Enter/Space 必须请求开合；ArrowDown 必须请求 open+first，ArrowUp 必须请求 open+last；每次宿主键盘激活最多提交一次 request。
      en: An enabled Trigger must request visibility changes from pointer, Enter, or Space; ArrowDown must request open plus first entry and ArrowUp open plus last entry; one host keyboard activation may submit at most one request.
  - id: P-BASE-DROPDOWN-MENU-TRIGGER-DISABLED
    text:
      zh-CN: Trigger 自身或 Root disabled 时必须抑制所有 open request 并退出 focus navigation。
      en: Trigger or Root disabled state must suppress every open request and remove Trigger from focus navigation.
