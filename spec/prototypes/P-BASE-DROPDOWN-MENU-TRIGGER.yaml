dependsOn:
  prototypes: [P-BASE-DROPDOWN-MENU]
  contracts: [C-A11Y-0001, C-AS-FOCUSABLE-0001, C-AS-TRIGGER-0001]
verifies: { tests: [T-BASE-DROPDOWN-MENU-TRIGGER-0001] }
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Cataloged Trigger command semantics, accessible popup relations, and keyboard entry requests.
  - version: 0.3.0-alpha.1
    change: clarified
    summary: Clarify draft cancellation and retained-view transient cleanup without changing semantic ownership or Host contact lifetime.
tags: [prototype, base, dropdown-menu, trigger, a11y, keyboard]
