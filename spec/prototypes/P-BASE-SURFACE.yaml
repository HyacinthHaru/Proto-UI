id: P-BASE-SURFACE
type: prototype
title: base passive Surface atom
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded passive presentation atom under current user-directed normalization. Draft pending independent review and exact-source browser evidence; native/compiler omissions remain explicit rather than implied by Web behavior.
summary: Reusable passive content surface with presentation-only facts, independent of any page or navigation protocol.
statement:
  en: Surface owns a slotted visual shell. Its consumer supplies layout, content and facts from the existing semantic owner. It does not own hover detection, focus, activation, selection, navigation, disclosure, clipboard, source editing or material effects. Base defines the common normalized input vocabulary without paint. No homepage, preview, code-toolbar or social-icon vocabulary is part of the API.
criteria:
  - id: P-BASE-SURFACE-PASSIVE
    text:
      en: Surface introduces no role, tabindex, focus request, event listener, activation, semantic state, native property forwarding or exposed method. Authored content remains in its original semantic ownership. Observed presentation inputs are not an event simulation or an independent interaction truth.
  - id: P-BASE-SURFACE-INPUTS
    text:
      en: Inputs are variant transparent|outline|secondary|muted|accent|solid|scrim, radius default|none|sm|md|lg|xl|full, border all|bottom|none, elevation none|raised, boolean hovered/focusVisible/pressed/current/fade, and observed transitionState closed|entering|entered|leaving. Defaults are outline/default/all/none, transitionState entered, and all booleans false. Absent inputs restore defaults. Family is not a Surface prop.
  - id: P-BASE-SURFACE-PROJECTION
    text:
      en: Base remains unstyled and exports asSurfaceRoot for family inheritance. Pointer hit ownership stays with the semantic host. Fade projects only the existing Transition owner phase; it does not create a clock, lifecycle, inertness or interaction state. Web surface-fade consumes --pui-surface-transition-duration, default 0ms, supplied only from finite nonnegative duration milliseconds by its composition owner. Reduced-motion uses 0ms. Scrim lowers to black at 80 percent opacity. Unsupported native lowering, including unresolved CSS duration variables and starting-style selectors, remains diagnostic, never an inferred support claim.
  - id: P-BASE-SURFACE-ENTRIES
    text:
      en: The public package root and /surface subpath expose Surface, with CLI registration for adapter facade consumption. Partial-family Surface defaults to neutral opaque outline presentation (transparent and scrim are ordinary fills, not material effects) and does not expand material or unrelated component compatibility guarantees.
sources:
  - path: packages/prototypes/base/src/surface/root.proto.ts
  - path: packages/prototypes/base/src/surface/index.ts
dependsOn:
  contracts: [C-CORE-SYNTAX-0003, C-PROPS-0001, C-FEEDBACK-STYLE-0002]
