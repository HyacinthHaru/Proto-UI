id: P-BRUTALIST-AVATAR
kind: prototype
status: draft
since: 0.2.0-rc.5
summary: Brutalist Avatar 是 Base Avatar 协议的方角、硬阴影样式增量。
relations:
  supersedes: []
  supersededBy: []
  governedBy: []
  implements: []
  tests:
    - T-BRUTALIST-AVATAR
  dependsOn:
    - P-BASE-AVATAR
  refines: []
  conflictsWith: []
implementation:
  - packages/prototypes/brutalist/src/avatar/root.proto.ts
  - packages/prototypes/brutalist/src/avatar/image.proto.ts
