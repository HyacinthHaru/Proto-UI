id: P-BRUTALIST-BUTTON
type: prototype
title: 'Brutalist Button inherits Base Button and layers a Neo-Brutalist visual API'

status: draft
since: 0.2.0-rc.7
summary: 'Brutalist Button inherits Base Button interaction semantics and adds a visual API with compatible solid/surface/destructive fills, an opt-in transparent ghost variant, paired foregrounds, family geometry, state feedback and live theme-compatible tokens.'

statement:
  en: P-BRUTALIST-BUTTON preserves its declared semantic, anatomy and API ownership. Its draft visual projection follows the component-specific typography, geometry, fill, depth and state criteria below, aligned with neobrutalism-components 3306a802. This does not admit new Base semantics, host support or upstream API compatibility.
  zh-CN: P-BRUTALIST-BUTTON 保留已声明的语义、anatomy 与 API owner。draft 视觉投射遵循下列按组件定义的字体、几何、填色、深度与状态准则，并向 neobrutalism-components 3306a802 对齐；不准入新的 Base 语义、host support 或上游 API 兼容性。

criteria:
  - id: P-BRUTALIST-BUTTON-BASE-INHERITANCE
    text:
      en: >-
        The prototype must inherit Base Button through `asButton()` once and must not redefine Base click, press, hover, focus, or disabled protocol semantics. Visual projection may only consume the projected state handles.


      zh-CN: >-
        该 prototype 必须通过 `asButton()` 一次性继承 Base Button，不得重定义 Base 的 click、press、hover、focus 或 disabled 协议语义；视觉投射只能消费投影出的 state handles。


  - id: P-BRUTALIST-BUTTON-ENTRY
    text:
      en: The direct prototype entry name is `brutalist-button` and is the only public Button entry in this foundation slice.
      zh-CN: 直接 prototype 入口名为 `brutalist-button`，且是本 foundation 切片中唯一公开的 Button 入口。
  - id: P-BRUTALIST-BUTTON-VARIANT-PROP
    text:
      en: Public variant is solid | surface | destructive | ghost and defaults to solid. The first three preserve their existing accent/paper/warning fill, structural black border and hard shadow. Ghost is an additive Proto UI presentation extension with transparent resting background/border, theme foreground and no hard shadow. No outline variant is introduced.
      zh-CN: 公开 variant 为 solid | surface | destructive | ghost，默认 solid。前三者保留既有强调/纸面/警告填充、结构黑框与硬影。ghost 是 Proto UI 自有呈现扩展，静止背景/边框透明、主题前景且无硬影；不新增 outline variant。

  - id: P-BRUTALIST-BUTTON-COLOR-PROP
    text:
      en: >-
        Public `color` is the enum `main | mint | lavender | coral | sky` with default `main`. It applies only when `variant` is `solid` and selects a fixed accent pair from the Brutalist palette.


      zh-CN: >-
        公开 `color` 为枚举 `main | mint | lavender | coral | sky`，默认 `main`。 仅在 `variant` 为 `solid` 时生效，并从 Brutalist 调色板选择固定强调色对。


  - id: P-BRUTALIST-BUTTON-SIZE-PROP
    text:
      en: Public `size` is the enum `default | sm | lg | icon` with default `default`.
      zh-CN: 公开 `size` 为枚举 `default | sm | lg | icon`，默认 `default`。
  - id: P-BRUTALIST-BUTTON-DEFAULTS
    text:
      en: >-
        When `variant`, `color`, `size`, or `disabled` are omitted or removed after mount, the prototype must restore `solid`, `main`, `default`, and `false` respectively.


      zh-CN: >-
        当 `variant`、`color`、`size` 或 `disabled` 缺省或在挂载后被移除时，prototype 必须分别恢复为 `solid`、`main`、`default` 与 `false`。


  - id: P-BRUTALIST-BUTTON-PAIR-INVARIANT
    text:
      en: Every fill co-selects its intended foreground. Solid uses bg-{color}/text-{color}-foreground; surface uses bg-secondary-background/text-foreground; destructive uses bg-destructive/text-destructive-foreground. Ghost uses bg-transparent/text-foreground and its hover/press neutral surface uses bg-secondary-background/text-foreground. No rule replaces a fill foreground independently of its background.
      zh-CN: 每种 fill 必须配对 foreground：solid 使用 bg-{color}/text-{color}-foreground；surface 使用 bg-secondary-background/text-foreground；destructive 使用 bg-destructive/text-destructive-foreground；ghost 使用 bg-transparent/text-foreground，hover/press 中性表面使用 bg-secondary-background/text-foreground。不得独立于背景替换填充的前景。

  - id: P-BRUTALIST-BUTTON-INTERACTION
    text:
      en: Solid, surface and destructive hover/press retain their existing +4px/+4px shadow-axis displacement, cleared hard shadow and matching hit envelope; press adds no second displacement. Ghost hover/press uses a neutral paired fill without displacement, hard shadow or motion hit envelope. All variants retain the same hard focus-visible ring/offset and disabled opacity/pointer gate from inherited Base states. Changing variants during interaction withdraws the previous paint and motion.
      zh-CN: solid、surface、destructive 的 hover/press 保留既有 +4px/+4px 阴影轴位移、去除硬影及匹配 hit envelope，press 不叠加第二次位移；ghost hover/press 使用中性色对，无位移、硬影或运动 hit envelope。所有 variant 继续从 Base 状态投射相同硬 focus-visible ring/offset 与 disabled opacity/pointer gate；交互中切换 variant 必须撤回旧 paint 与 motion。

  - id: P-BRUTALIST-BUTTON-VISUAL-GRAMMAR
    text:
      en: All variants retain 5px rounded-base geometry, DM Sans font-sans/system fallback, font-medium and authored casing. The original solid/surface/destructive variants retain visible 2px black borders, paired fills and 4px/4px zero-blur hard shadows. Ghost retains a transparent 2px border for stable geometry, transparent rest fill and no hard shadow. Default labels remain14px/20px; no gradients, glass or blur are added.
      zh-CN: 所有 variant 保留5px rounded-base几何、DM Sans font-sans/系统fallback、font-medium及作者大小写。既有solid/surface/destructive保留可见2px黑边、配对fill和4px/4px零模糊硬影；ghost保留透明2px边框以稳定几何，静止fill透明且无硬影。默认标签仍14px/20px，不新增gradient、glass或blur。

  - id: P-BRUTALIST-BUTTON-LIGHT-DARK
    text:
      en: Solid accent pairs remain theme-invariant with paired black ink. Surface/destructive and ghost foreground/interaction fills resolve through host CSS variables, keeping their paired contrast across Light and Dark without pointer interaction.
      zh-CN: solid强调色对仍为主题不变的配对黑色ink；surface/destructive及ghost前景/交互fill经宿主CSS变量解析，在Light/Dark切换中无须指针交互即可保持配对对比。

  - id: P-BRUTALIST-BUTTON-LIVE-THEME
    text:
      en: >-
        When the active host theme changes after the Button is mounted, theme-dependent surfaces (those that resolve through Brutalist CSS variables such as `--pui-secondary-background` and `--pui-foreground`) must repaint without requiring pointer interaction. Disabled controls must also repaint under the same host-theme transition. The supported mechanism is host-theme-driven CSS variable resolution; a `colorScheme` meta or `prefers-color-scheme` path is not part of this criterion.


      zh-CN: >-
        当 Brutalist Button 已挂载后活动宿主主题发生变化时，主题相关表面（经 Brutalist CSS 变量如 `--pui-secondary-background` 与 `--pui-foreground` 解析的表面）必须在无需指针交互的情况下重绘；Disabled 控件在相同宿主主题切换下也必须重绘。支持机制为宿主主题驱动的 CSS 变量解析；`colorScheme` meta 或 `prefers-color-scheme` 路径不属于本准则。


