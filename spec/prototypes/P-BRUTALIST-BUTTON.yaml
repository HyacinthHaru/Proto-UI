    change: revised
    summary: Aligned draft visual grammar with neobrutalism-components 3306a802; preserved Base semantics and documented Proto UI extensions.
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Introduced the draft Neo-Brutalist Button projection as the reference family of the Brutalist style foundation slice on the rc.7 release train (redesigned public API: solid/surface/destructive + accent color, paired foreground invariant, live theme behavior). Not present in the immutable rc.6 snapshot.


  - version: 0.3.0-alpha.1
    change: revised
    summary: Added opt-in ghost visual variant without changing the original variants or inherited Base interaction semantics.

