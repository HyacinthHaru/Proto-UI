    label: shadcn/ui v4 new-york DialogTrigger pinned baseline
dependsOn:
  contracts: [C-AS-HOOK-0001]
  decisions:
    [
      D-PROTOTYPE-ENTITY-NAMING-0001,
      D-AS-CHILD-OMISSION-0001,
