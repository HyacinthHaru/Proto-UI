  prototypes:
    [
      {
        id: P-BASE-DIALOG-CLOSE,
        note: Default inherited close-command protocol; explicit setup-time negative patches must be declared.,
      },
    ]
verifies: { tests: [T-SHADCN-DIALOG-CLOSE-0001] }
