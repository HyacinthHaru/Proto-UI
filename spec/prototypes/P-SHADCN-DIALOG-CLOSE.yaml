id: P-SHADCN-DIALOG-CLOSE
type: prototype
title: Shadcn Dialog Close inherits Base close-command behavior without visual styling
status: draft
since: 0.2.0-rc.0
summary: Shadcn Dialog Close is an unstyled semantic close boundary; button and default X surfaces are composed through separate prototypes or presets.
statement:
  zh-CN: >-
    Shadcn Dialog Close 是 `P-BASE-DIALOG-CLOSE` 之上的无样式 direct part，保留 close command/request 与 disabled behavior，但不提供 button variant 或默认视觉 surface。Footer Button composition 通过嵌套 trigger 合并完成；Content 默认 X 由独立 `shadcn-dialog-close-icon` prototype 和 CLI preset 物化，二者不得被隐藏进本 prototype 边界。`asChild` 明确不提供。


  en: >-
    Shadcn Dialog Close is an unstyled direct part over `P-BASE-DIALOG-CLOSE`. It retains close-command, request, and disabled behavior but provides neither button variants nor a default visual surface. Footer Button composition uses nested-trigger merging, while Content's default X is materialized by the independent `shadcn-dialog-close-icon` prototype and a CLI preset; neither may be hidden inside this prototype boundary. `asChild` is explicitly unavailable.


criteria:
  - id: P-SHADCN-DIALOG-CLOSE-UPSTREAM-IDENTITY
    text:
      {
        zh-CN: Close 必须沿用固定 Dialog revision/path 并区分 standalone wrapper 与 Content 内置 X Close。,
        en: Close must use the pinned Dialog revision and path and distinguish the standalone wrapper from the built-in X Close in Content.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-BASE-INHERITANCE
    text:
      {
        zh-CN: '`shadcn-dialog-close` 必须继承 `P-BASE-DIALOG-CLOSE` 并调用 `asDialogClose()`。',
        en: '`shadcn-dialog-close` must inherit `P-BASE-DIALOG-CLOSE` and call `asDialogClose()`.',
      }
    references:
      prototypes:
        - id: P-BASE-DIALOG-CLOSE
          anchors:
            [
              P-BASE-DIALOG-CLOSE-AUTHORING-ENTRIES,
              P-BASE-DIALOG-CLOSE-COMMAND,
              P-BASE-DIALOG-CLOSE-REQUEST,
              P-BASE-DIALOG-CLOSE-DISABLED,
            ]
  - id: P-SHADCN-DIALOG-CLOSE-CURRENT-BASE-DEVIATIONS
    text:
      {
        zh-CN: 当前实现不反转 inherited close command/request 或 disabled guarantee，也不添加视觉增量。,
        en: The current implementation reverses no inherited close-command,
        request,
        or disabled guarantee and adds no visual delta.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-DIRECT-ENTRY
    text:
      {
        zh-CN: 当前 Close protocol 以 `shadcn-dialog-close` direct prototype 公开。,
        en: The current Close protocol is exposed as the `shadcn-dialog-close` direct prototype.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-UNSTYLED-SURFACE
    text:
      {
        zh-CN: Close 不得声明 variant 或默认视觉 tokens；它只投射 inherited close-command semantic surface。,
        en: Close must declare neither variants nor default visual tokens; it projects only the inherited close-command semantic surface.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-COMPOSITION-BOUNDARY
    text:
      {
        zh-CN: Button 视觉必须由显式嵌套 Button 提供，并依 trigger-group 规则只保留一个宿主 focus/a11y surface；focus scope 必须把该 group 视为一个导航成员并让最内层 Button 呈现 focusVisible feedback。,
        en: Button visuals must come from an explicitly nested Button and retain one host focus and accessibility surface under trigger-group rules; a focus scope must count the group as one navigation member and let the innermost Button present focusVisible feedback.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-DEFAULT-X-SEPARATION
    text:
      {
        zh-CN: 默认 X 必须由独立 CloseIcon prototype 与 component preset 组合，不得成为 Close 或 Content 内部的隐藏交互实例。,
        en: The default X must be composed from an independent CloseIcon prototype and component preset,
        never as a hidden interactive instance inside Close or Content.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-COMPATIBILITY-SUBSET
    text:
      {
        zh-CN: standalone Close、Footer Button composition 与默认 X Close 必须保持为三个明确消费面。,
        en: Standalone Close,
        Footer Button composition,
        and the default X Close must remain three explicit consumption surfaces.,
      }
  - id: P-SHADCN-DIALOG-CLOSE-AS-CHILD-OMISSION
    text:
      {
        zh-CN: upstream Close props 中的 `asChild` 依共享决策省略。,
        en: Upstream Close `asChild` is omitted under the shared decision.,
      }
    dependsOn: { decisions: [D-AS-CHILD-OMISSION-0001] }
sources:
