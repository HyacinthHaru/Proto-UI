id: P-BASE-TOGGLE-GROUP
type: prototype
title: ToggleGroup owns orientation and view-bound request notifications
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded draft orientation and request-lifecycle slices; complete ToggleGroup cataloging, real-host layout, native and Compiler composition and independent admission remain incomplete.
summary: Base owns orientation across family layouts and retires accepted request notifications with their originating view.
statement:
  en: ToggleGroup Root owns the effective orientation, horizontal when omitted. Existing Props normalization remains authoritative. Accessibility orientation, roving axis and the typed asToggleGroupRoot orientation state describe the same effective value. Family recipes only read this borrowed state; this is a recipe constraint, not a new read-only hook capability. No AppMaker orientation expose is introduced. Accepted request notifications retain their originating owner and view epoch and drain in the local publication queue order.
criteria:
  - id: P-BASE-TOGGLE-GROUP-OWNER
    text:
      en: Preserve the existing horizontal-or-vertical prop and its normalization. Extend the typed hook state contract with orientation matching the existing string state. Borrowed state operations retain C-AS-HOOK-0007 semantics. Family recipes compose Base once and only read its orientation; they must not infer it from DOM or install independent orientation, keyboard or collection ownership.
  - id: P-BASE-TOGGLE-GROUP-LAYOUT
    text:
      en: Shadcn, Brutalist, Bootstrap 2.3.2 and Liquid Glass root projections arrange vertical items in a column and retain the existing horizontal row when omitted or horizontal. Reversible prop changes withdraw the previous direction contribution without resetting selection, membership or focus ownership. This slice adds no selection, size, variant or spacing behavior and does not claim complete upstream visual parity.
  - id: P-BASE-TOGGLE-GROUP-EVIDENCE
    text:
      en: Verify initial and dynamic axes, default horizontal preservation, invalid and empty prop normalization, typed hook boundaries, selection retention and orientation-aware navigation separately from real-host geometry and screenshots. Synthetic host checks alone cannot admit complete visual or native and Compiler conformance.
  - id: P-BASE-TOGGLE-GROUP-REQUEST-RETIREMENT
    text:
      en: An accepted requestToggle retains its true return even when synchronous Context publication unmounts, disposes or remounts its Root. Its old valueChange notification must not run after that originating owner or view epoch retires. A fresh request after remount remains usable. This does not roll back accepted logical selection or change controlled-owner authority.
  - id: P-BASE-TOGGLE-GROUP-NOTIFICATION-ORDER
    text:
      en: Accepted notifications deferred within one finite Root publication chain retain their queue order. A valueChange callback may enter another accepted request, but its notification joins the same queue behind already queued work. Each delivery rechecks its originating owner and view epoch. This is a local proposal-notification rule, not a global Context order, latest-value-only policy or guarantee for author-created infinite reentry.
openQuestions:
  - id: P-BASE-TOGGLE-GROUP-Q-ADMISSION
    question:
      en: When do complete ToggleGroup definitions, exact-source real-host layout and screenshots, native and Compiler composition and independent review support admission?
    blocks:
      - activation:P-BASE-TOGGLE-GROUP
