id: P-BRUTALIST-TOOLTIP
type: prototype
title: Brutalist Tooltip behavioral projection
status: draft
since: 0.2.0-rc.7
summary: Brutalist Tooltip inherits the complete Base Tooltip behavior across five parts and styles only Content and Arrow.
statement:
  en: Brutalist Tooltip is a private, non-launch projection over Base Tooltip. Root, Trigger, and Content inherit Base visibility, delay, interaction, accessibility, Overlay, presence, portal-positioning, and Escape behavior unchanged. Portal remains a logical carrier. Content receives the square high-contrast surface and Arrow receives foreground fill without geometry.
  zh-CN: Brutalist Tooltip 是基于 Base Tooltip 的私有 non-launch projection。Root、Trigger、Content 原样继承 Base visibility、delay、interaction、accessibility、Overlay、presence、portal-positioning 与 Escape behavior。Portal 仍是 logical carrier；Content 获得方形高对比 surface，Arrow 获得 foreground fill 但不获得 geometry。
criteria:
  - id: P-BRUTALIST-TOOLTIP-FIVE-PART-INHERITANCE
    text:
      en: Root, Trigger, Portal, Content, and Arrow must each consume the corresponding Base Tooltip authored asHook and preserve the Base shell anatomy.
      zh-CN: Root、Trigger、Portal、Content、Arrow 必须分别消费对应的 Base Tooltip authored asHook，并保留 Base shell anatomy。
  - id: P-BRUTALIST-TOOLTIP-BASE-BEHAVIOR-INHERITANCE
    text:
      en: Root, Trigger, and Content must preserve the corresponding Base Tooltip props, exposes, state ownership, requests, accessibility, and Overlay behavior without adding a second behavior path.
      zh-CN: Root、Trigger、Content 必须保留对应 Base Tooltip props、exposes、state ownership、requests、accessibility 与 Overlay behavior，不得增加第二条 behavior path。
  - id: P-BRUTALIST-TOOLTIP-VISUAL-SCOPE
    text:
      en: Only Content and Arrow may add Brutalist feedback style; Root, Trigger, and Portal must remain unstyled inheritance carriers.
      zh-CN: 只有 Content 与 Arrow 可以增加 Brutalist feedback style；Root、Trigger、Portal 必须保持为无样式 inheritance carriers。
sources:
