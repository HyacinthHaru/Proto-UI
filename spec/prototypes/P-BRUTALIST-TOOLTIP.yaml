id: P-BRUTALIST-TOOLTIP
type: prototype
title: Brutalist Tooltip static visual shell
status: draft
since: 0.2.0-rc.7
summary: Brutalist Tooltip inherits all five Base anatomy parts and styles only Content and Arrow.
statement:
  en: Brutalist Tooltip is a private, non-launch visual projection over the static Base Tooltip shell. Root, Trigger, and Portal add no behavior or style; Content receives the square high-contrast surface and Arrow receives foreground fill. The family remains non-interactive.
  zh-CN: Brutalist Tooltip 是基于静态 Base Tooltip shell 的私有 non-launch visual projection。Root、Trigger、Portal 不增加 behavior 或 style；Content 获得方形高对比 surface，Arrow 获得 foreground fill。该 family 仍不可交互。
criteria:
  - id: P-BRUTALIST-TOOLTIP-FIVE-PART-INHERITANCE
    text:
      en: Root, Trigger, Portal, Content, and Arrow must each consume the corresponding Base Tooltip authored asHook and preserve the Base shell anatomy.
      zh-CN: Root、Trigger、Portal、Content、Arrow 必须分别消费对应的 Base Tooltip authored asHook，并保留 Base shell anatomy。
  - id: P-BRUTALIST-TOOLTIP-STATIC-BOUNDARY
    text:
      en: The projection must not add open state, interaction routing, delay, accessibility semantics, dismissal, presence, renderer portal ownership, or positioning behavior.
      zh-CN: 该 projection 不得增加 open state、interaction routing、delay、accessibility semantics、dismissal、presence、renderer portal ownership 或 positioning behavior。
  - id: P-BRUTALIST-TOOLTIP-VISUAL-SCOPE
    text:
      en: Only Content and Arrow may add Brutalist feedback style; Root, Trigger, and Portal must remain unstyled inheritance carriers.
      zh-CN: 只有 Content 与 Arrow 可以增加 Brutalist feedback style；Root、Trigger、Portal 必须保持为无样式 inheritance carriers。
sources:
