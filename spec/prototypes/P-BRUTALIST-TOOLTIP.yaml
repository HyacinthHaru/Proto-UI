    change: introduced
    summary: Introduced the private five-part Brutalist Tooltip projection.
  - version: 0.2.0-rc.7
    change: refined
    summary: Inherited verified Base Tooltip interaction and accessibility while retaining Content/Arrow-only visual scope.
