    - id: P-BASE-TOOLTIP-TRIGGER
      anchors:
        - P-BASE-TOOLTIP-TRIGGER-INTERACTION
        - P-BASE-TOOLTIP-TRIGGER-DISABLED
        - P-BASE-TOOLTIP-TRIGGER-A11Y
    - id: P-BASE-TOOLTIP-CONTENT
      anchors:
        - P-BASE-TOOLTIP-CONTENT-OVERLAY-PRESENCE
        - P-BASE-TOOLTIP-CONTENT-HOVER-BRIDGE
        - P-BASE-TOOLTIP-CONTENT-A11Y
        - P-BASE-TOOLTIP-CONTENT-ESCAPE
exercises:
  prototypes:
    - P-BASE-TOOLTIP
    - P-BASE-TOOLTIP-TRIGGER
    - P-BASE-TOOLTIP-PORTAL
    - P-BASE-TOOLTIP-CONTENT
