id: T-SURFACE-0001
type: test
title: Passive Surface Adapter and compiler consumption
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Source-bound real four-Adapter and Web compiler cases pass locally; exact-source browser review and independent admission remain pending.
summary: Verifies roleless content ownership and finite presentation inputs without a second interaction owner.
cases:
  - id: T-SURFACE-0001-CASE-PASSIVE
    title: Real framework and WC adapters preserve native ownership
    covers:
      [
        P-BASE-SURFACE-PASSIVE,
        P-BASE-SURFACE-INPUTS,
        P-SHADCN-SURFACE-PROJECTION,
        P-BRUTALIST-SURFACE-PROJECTION,
        P-BOOTSTRAP-2-3-2-SURFACE-PROJECTION,
        P-LIQUID-GLASS-SURFACE-PROJECTION,
      ]
    expectation: Native content remains and the passive child has no role, tabindex or activation channel across updates.
  - id: T-SURFACE-0001-CASE-COMPILER
    title: Public exports, four Web facades and honest unsupported targets
    covers:
      [
        P-BASE-SURFACE-ENTRIES,
        P-SHADCN-SURFACE-ENTRIES,
        P-BRUTALIST-SURFACE-ENTRIES,
        P-BOOTSTRAP-2-3-2-SURFACE-ENTRIES,
        P-LIQUID-GLASS-SURFACE-ENTRIES,
      ]
    expectation: All declared tokens produce Web CSS, public entries generate each Web facade, and unsupported target or token remains an explicit error or diagnostic.
implementations:
  - id: surface-public-compiler
    kind: module-test
    status: passing
    path: packages/cli/test/surface-prototype.test.ts
    required: true
    consumesCases: [T-SURFACE-0001-CASE-COMPILER]
    exercises:
      [
        P-BASE-SURFACE,
        P-SHADCN-SURFACE,
        P-BRUTALIST-SURFACE,
        P-BOOTSTRAP-2-3-2-SURFACE,
        P-LIQUID-GLASS-SURFACE,
      ]
  - id: surface-real-adapters
    kind: adapter-test
    status: passing
    path: packages/web-conformance/test/surface.journey.test.ts
    required: true
    consumesCases: [T-SURFACE-0001-CASE-PASSIVE]
    exercises:
      [
        P-BASE-SURFACE,
        P-SHADCN-SURFACE,
        P-BRUTALIST-SURFACE,
        P-BOOTSTRAP-2-3-2-SURFACE,
        P-LIQUID-GLASS-SURFACE,
      ]
verifies:
  prototypes:
    [
      P-BASE-SURFACE,
      P-SHADCN-SURFACE,
      P-BRUTALIST-SURFACE,
      P-BOOTSTRAP-2-3-2-SURFACE,
      P-LIQUID-GLASS-SURFACE,
    ]
exercises:
  prototypes:
    [
      P-BASE-SURFACE,
      P-SHADCN-SURFACE,
      P-BRUTALIST-SURFACE,
      P-BOOTSTRAP-2-3-2-SURFACE,
      P-LIQUID-GLASS-SURFACE,
    ]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added passive Surface real Adapter conformance.
tags: [test, surface]
