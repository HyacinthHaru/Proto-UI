id: T-BASE-TABS-CONTENT-0001
type: test
title: Base Tabs Content protocol contract tests
status: draft
since: 0.1.0
summary: Contract test coverage for Base Tabs Content current/hidden semantics, focus entry, default L1 detach, and keepMounted retention.
cases:
  - id: T-BASE-TABS-CONTENT-0001-CASE-HIDDEN
    title: Tabs Content derives current state by value matching and detaches inactive views by default
    covers:
      - P-BASE-TABS-CONTENT-ROLE-PANEL
      - P-BASE-TABS-CONTENT-AUTHORING-ENTRIES
      - P-BASE-TABS-CONTENT-PROTOCOL-DEPENDENCY
      - P-BASE-TABS-CONTENT-CLAIM-ROLE
      - P-BASE-TABS-CONTENT-SAME-DOMAIN
      - P-BASE-TABS-CONTENT-PROP-VALUE
      - P-BASE-TABS-CONTENT-CONTEXT-CONSUME
      - P-BASE-TABS-CONTENT-CURRENT-DERIVED
      - P-BASE-TABS-CONTENT-CURRENT-EXPOSE
      - P-BASE-TABS-CONTENT-HIDDEN-WHEN-INACTIVE
      - P-BASE-TABS-CONTENT-DEFAULT-L1-DETACH
      - P-BASE-TABS-CONTENT-A11Y-ROLE
      - P-BASE-TABS-CONTENT-A11Y-LABELLEDBY-TARGET
      - P-BASE-TABS-CONTENT-A11Y-HIDDEN
    expectation: tabs-content-current-and-hidden-state-follow-selected-value
  - id: T-BASE-TABS-CONTENT-0001-CASE-FOCUS-ENTRY
    title: Current Tabs Content uses descendant-first focus entry with self fallback while inactive content is removed from focus entry
    covers:
      - P-BASE-TABS-CONTENT-FOCUS-ENTRY
    expectation: tabs-content-focus-entry-descendant-first-fallback-self
  - id: T-BASE-TABS-CONTENT-0001-CASE-PRESENCE-POLICY
    title: Tabs Content defaults to L1 detach while keepMounted retains the complete inactive view
    covers:
      - P-BASE-TABS-CONTENT-PRESENCE-POLICY
    expectation: tabs-content-view-policy-detaches-and-rebinds-without-instance-recreation
implementations:
  - id: prototypes-base-tabs-content-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/tabs.test.ts
    required: true
    consumesCases:
      - T-BASE-TABS-CONTENT-0001-CASE-HIDDEN
      - T-BASE-TABS-CONTENT-0001-CASE-FOCUS-ENTRY
    exercises:
      - P-BASE-TABS-CONTENT
  - id: adapter-vue-tabs-content-presence
    kind: adapter-test
    status: passing
    path: packages/adapters/vue/test/tabs.test.ts
    required: true
    consumesCases:
      - T-BASE-TABS-CONTENT-0001-CASE-PRESENCE-POLICY
    exercises:
      - P-BASE-TABS-CONTENT
  - id: adapter-web-component-tabs-content-presence
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/tabs.test.ts
    required: true
    consumesCases:
      - T-BASE-TABS-CONTENT-0001-CASE-PRESENCE-POLICY
    exercises:
      - P-BASE-TABS-CONTENT
verifies:
  prototypes:
    - id: P-BASE-TABS-CONTENT
      anchors:
        - P-BASE-TABS-CONTENT-CURRENT-DERIVED
        - P-BASE-TABS-CONTENT-HIDDEN-WHEN-INACTIVE
        - P-BASE-TABS-CONTENT-A11Y-LABELLEDBY-TARGET
        - P-BASE-TABS-CONTENT-FOCUS-ENTRY
        - P-BASE-TABS-CONTENT-PRESENCE-POLICY
exercises:
  prototypes:
    - P-BASE-TABS-CONTENT
revisions:
  - version: 0.1.0
    change: introduced
    summary: Introduced Base Tabs Content protocol test entity aligned to P-BASE-TABS-CONTENT criteria.
  - version: 0.1.1
    change: refined
    summary: Added focus entry coverage for current tabpanel descendant-first behavior and inactive panel disablement.
  - version: 0.1.2
    change: expanded
    summary: Added React and Vue coverage for lazyMount, unmountOnExit, and keepMounted.
  - version: 0.1.3
    change: breaking
    summary: Replaced legacy boolean combinations with Vue coverage for default L1 detach and keepMounted retention.
tags:
  - prototype
  - base
  - tabs
  - content
  - test
