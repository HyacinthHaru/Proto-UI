id: T-BOOTSTRAP-2-3-2-BUTTON-0001
type: test
title: Bootstrap 2.3.2 Button evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Tests cover the bounded visual foundation; stable and cross-host admission are not implied.
summary: Unit state/token closure plus a collected real-four-Web Button fixture; native/compiler remain outside this slice.
cases:
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-INHERITANCE
    title: Identity, inherited Base states and restored defaults
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-BASE
      - P-BOOTSTRAP-2-3-2-BUTTON-API
    expectation: base-inherited-state-and-defaults
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-TOKENS
    title: Source-extracted finite style vocabulary and theme closure
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-VISUAL
      - P-BOOTSTRAP-2-3-2-BUTTON-CLOSURE
    expectation: source-token-physical-closure
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-BROWSER
    title: Real four-Web-adapter rendering and activation
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-BASE
      - P-BOOTSTRAP-2-3-2-BUTTON-VISUAL
      - P-BOOTSTRAP-2-3-2-BUTTON-CLOSURE
    expectation: real-web-host-button-appearance-and-interaction
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PIXEL-CSS
    title: Fixed upstream pixel units in source-derived CSS
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
      - P-BOOTSTRAP-2-3-2-BUTTON-CLOSURE
    expectation: source-derived-pixel-dimensions
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-ROOT-FONT
    title: Real four-Web root16/root32 dimensions and input transitions
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
      - P-BOOTSTRAP-2-3-2-BUTTON-BASE
      - P-BOOTSTRAP-2-3-2-BUTTON-API
    expectation: root-font-independent-pixel-metrics-and-activation
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-SIZES
    title: Exclusive size switching, disabled state and actual raw-prop removal
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-API
      - P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
    expectation: exclusive-size-rules-and-default-restoration
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-SIZES-BROWSER
    title: All sizes and both variants in the real four-Web root-font matrix
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
      - P-BOOTSTRAP-2-3-2-BUTTON-BASE
      - P-BOOTSTRAP-2-3-2-BUTTON-API
    expectation: fixed-size-metrics-input-disabled-and-explicit-restoration
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PALETTE
    title: Seven palette states, actual merged ownership and unchanged legacy consumers
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-PALETTE
      - P-BOOTSTRAP-2-3-2-BUTTON-STATE-PAINT
      - P-BOOTSTRAP-2-3-2-BUTTON-PAINT-OWNERS
      - P-BOOTSTRAP-2-3-2-BUTTON-CLOSURE
    expectation: source-aligned-paint-states-and-finite-closure
  - id: T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PALETTE-BROWSER
    title: Seven palettes and five real-input paint states through four Web runtimes
    covers:
      - P-BOOTSTRAP-2-3-2-BUTTON-PALETTE
      - P-BOOTSTRAP-2-3-2-BUTTON-STATE-PAINT
      - P-BOOTSTRAP-2-3-2-BUTTON-DIMENSIONS
      - P-BOOTSTRAP-2-3-2-BUTTON-BASE
    expectation: real-input-palette-state-and-size-matrix
implementations:
  - id: bootstrap-2-3-2-button-contract
    kind: module-test
    status: passing
    path: packages/prototypes/bootstrap-2-3-2/test/button.test.ts
    required: true
    consumesCases:
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-INHERITANCE
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-TOKENS
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PIXEL-CSS
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-SIZES
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PALETTE
  - id: bootstrap-2-3-2-button-browser
    kind: runtime-test
    status: passing
    path: apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts
    required: true
    consumesCases:
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-BROWSER
    notes:
      - This is a Web-only fixture; it does not establish native or Prototype Compiler parity.
      - Passed at source 9c10090bd497b73890a4599459bebf3c828aa157 in GitHub Actions run 37119252013, Node 24.21.0 and Chrome 154.0.8037.57. The five browser cases cover only the Bootstrap 2.3.2 default/primary Button and Liquid Glass opaque fallback through WC, React, Vue 3 and Vue 2; no translucent material or wider family/native support is admitted.
      - The exact-head artifact contains paired pressed/focus states, light/dark/mobile captures and disposal metadata. Official project-local Astro devToolbar.enabled=false was read back; all 24 fixture controls and runtime roots were removed, with no page-wide survivor in that capture run.
  - id: bootstrap-2-3-2-button-root-font-browser
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts
    required: true
    consumesCases:
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-ROOT-FONT
    notes:
      - Root16/root32 metric, activation, disabled and explicit-prop-restoration assertions are authored; exact-candidate real browser execution and screenshots remain pending. The patch-only public fixture does not establish actual prop-removal behavior; that remains unit evidence only. This is not browser zoom or native/compiler evidence.
  - id: bootstrap-2-3-2-button-sizes-browser
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts
    required: true
    consumesCases:
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-SIZES-BROWSER
    notes:
      - Same mounted real controls switch large/mini/small/default at root16/root32 through WC, React, Vue 3 and Vue 2, with computed dimensions, activation and disabled checks for both variants. PNG/JSON evidence is bound to source SHA and upstream version when the workflow runs; no current native pass is claimed.
      - The public demo API uses explicit restoration. Actual prop removal is unit evidence only; browser zoom and native/compiler targets remain unverified.
  - id: bootstrap-2-3-2-button-paint-css
    kind: module-test
    status: passing
    path: packages/cli/test/bootstrap-button-paint.test.ts
    required: true
    consumesCases:
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PALETTE
    notes:
      - Checks exact document/Shadow declarations, actual semantic merging, unsupported/injected recipe rejection and byte-identical exact-base legacy passive paint CSS.
  - id: bootstrap-2-3-2-button-palette-browser
    kind: runtime-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/demo-new-projection-families.browser.test.ts
    required: true
    consumesCases:
      - T-BOOTSTRAP-2-3-2-BUTTON-0001-CASE-PALETTE-BROWSER
    notes:
      - Rest/focused/hovered/pressed/disabled computed background/image/position/repeat/text-shadow/four-edge colors, focus ring, disabled shadow priority, per-input counts, node identity and four-size compatibility are authored for seven variants and four real Web runtimes. Exact-head browser execution and PNG/JSON remain pending.
      - Tests do not claim 100ms motion, browser zoom, real patch-API prop removal, contrast acceptance or native/compiler support. Explicit restoration and unit raw-prop removal remain distinct.
exercises:
  prototypes:
    - P-BOOTSTRAP-2-3-2-BUTTON
