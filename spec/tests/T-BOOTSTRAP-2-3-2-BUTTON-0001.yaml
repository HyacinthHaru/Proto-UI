    summary: Added source-derived fixed-pixel regression and separately planned root-font browser coverage without extending the historical browser pass to the new case.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added passing unit size-switch/removal coverage and a separately planned all-size real-four-Web browser matrix; historical passes do not establish the new case.
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added seven-palette unit and finite complete-paint closure evidence, plus separately planned real-input state/size browser coverage; historical browser results do not establish this matrix.
