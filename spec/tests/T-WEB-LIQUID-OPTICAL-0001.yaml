id: T-WEB-LIQUID-OPTICAL-0001
type: test
title: V2 Web optical provider ownership and visible canvas source evidence
status: draft
since: 0.3.0-alpha.1
lifecycleRationale: Pure provenance and mocked GPU ownership checks pass locally; actual four-Web optical output, emitted-package parity and independent visual acceptance require exact-head CI. No native or arbitrary DOM capture support is admitted.
summary: Governs the bounded visible application canvas provider without relabeling owned textures as captured DOM or policy eligibility as paint.
cases:
  - id: T-WEB-LIQUID-OPTICAL-0001-CASE-STYLE
    title: Complete post-patch tokens and palette roles establish ownership
    covers:
      - C-FEEDBACK-MATERIAL-0001-FALLBACK
      - C-FEEDBACK-MATERIAL-0001-PROVENANCE
    expectation: reject-ambiguous-alpha-cyclic-selector-or-competing-style
  - id: T-WEB-LIQUID-OPTICAL-0001-CASE-SOURCE
    title: Visible canvas lease excludes self output and unrepresented paint
    covers:
      - C-FEEDBACK-MATERIAL-0001-SAFETY
      - C-FEEDBACK-MATERIAL-0001-QUALITY
    expectation: revoke-stale-cross-scope-overlap-and-composited-source
  - id: T-WEB-LIQUID-OPTICAL-0001-CASE-VIEW
    title: Physical view waits for style delivery and cannot publish a superseded lease
    covers:
      - C-FEEDBACK-MATERIAL-0001-OWNERSHIP
      - C-FEEDBACK-MATERIAL-0001-SAFETY
      - C-FEEDBACK-MATERIAL-0001-SEMANTICS
    expectation: delayed-style-static-motion-revocation-and-release-controls
  - id: T-WEB-LIQUID-OPTICAL-0001-CASE-OPTICS
    title: Four runtime GPU output against opaque and zero-refraction controls
    covers:
      - C-FEEDBACK-MATERIAL-0001-GEOMETRY
      - C-FEEDBACK-MATERIAL-0001-QUALITY
    expectation: exact-source-rendered-pixels-and-independent-visual-review
  - id: T-WEB-LIQUID-OPTICAL-0001-CASE-TINT
    title: Opt-in style-fill tint preserves current foreground contrast and same-source optics
    covers:
      - C-FEEDBACK-MATERIAL-0001-GRAMMAR
      - C-FEEDBACK-MATERIAL-0001-FALLBACK
      - C-FEEDBACK-MATERIAL-0001-SAFETY
      - C-FEEDBACK-MATERIAL-0001-QUALITY
    expectation: bounded-first-party-tint-with-nonempty-source-bound-pixels-and-negative-controls
    notes:
      - Neutral shader literals and no-tint behavior remain unchanged. Unsupported variant or profile uses same-state fallback. Tint identity participates in pipeline, paint leases and diagnostic profile; old seed profiles reject tint.
      - The finite shared-context pipeline cache must keep program-specific uniforms and attributes, current source uploads, bounded resources and complete cleanup. Interleaved neutral/tint GPU output must match independent controls without per-frame recompilation.
      - Style-tint profile 4 replaces profile 2's original fallback-luminance safe side with the same governed foreground's reserved contrast envelope. The original fill still supplies source-mixed hue and the opaque fallback; enhanced output may cross its luminance and spend some of its contrast margin. This is an explicit material interpretation change, including formerly collapsed black/white fill envelopes. Profile 3 was a rejected arithmetic candidate and is not an accepted compatibility identity.
      - Derive polarity from the admitted opaque semantic fill/foreground pair. For light foreground use its per-channel clamped minus 1.5/255 endpoint; for dark foreground use plus 1.5/255. This interval covers the existing one-code CSS match allowance plus nominal half-code display rounding, not a contrast guarantee for every antialiased glyph edge. No computed CSS color becomes a new owner.
      - The light luminance bound is the feasible lower endpoint after exactly 32 bisections of X plus the monotone luminance-domain reserve, using 5.5/255 encoded upward error, saturation-corrected per-channel caps and the exact sRGB decoder join allowance. The dark bound adds the fixed 0.0675118372261112 linear reserve. These reserves include the current full shape/black-shadow model. Empty or zero-width proof budgets explicitly refuse enhancement rather than clamping into a guarantee. This stricter budget and interval readback may refuse nominally admitted near-4.5 pairs that profile 2 enhanced; finite-matrix old-pass retention is not a universal no-fallback-regression claim.
      - Map source code-luma affinely in encoded space from zero to the encoded light bound, or from the encoded dark bound to one; decode this target and retain the existing 75 percent fill / 25 percent source linear-light hue and 2^-12 normalization floor. No palette-name branch, parameter fitting or noise injection is permitted. Per-channel fill bounds and every-pixel fixed blue hue are not the definition of readable tint.
      - Both static/contact tint programs receive one private luminance-bound uniform derived anew from the same semantic frame as polarity, fill, foreground and paint lease. Convert that bound inward to float32; this only budgets uniform representation, not accumulated highp or mediump GPU arithmetic. Actual readback remains fail-closed at 4.5 contrast and original polarity against that same worst foreground endpoint, including opaque pixels and alpha 250 through 254 over black/white composites, with nonempty opaque coverage required.
      - Preserve all original detail thresholds and original 30-cell / fixed 504-cell inputs, old-pass classifications and Toggle controls. The old muted near-white cell remains failed at span 7.17568 and reorder RMS 3.91629 in arithmetic; improvement is not acceptance. Report fallback separately from successful optical paint. No-tint shader bytes, source admission, seed tint rejection, preference guards and selected-state semantics remain unchanged.
      - Whole-image color count is only a coarse diagnostic, not an appearance acceptance criterion. The independently frozen inner-content challenge requires structured amplitude and same-histogram source response against flat, noise and retired-map controls. Its engineering thresholds are not Apple numeric criteria; actual public selected appearance still requires independent exact-head visual review.
      - Numerical oracle and mocked ABI are not GPU evidence. Fixed source revision, geometry and motion must distinguish tinted optical pixels from neutral and zero-refraction controls without mistaking opaque overlay or empty samples for success.
