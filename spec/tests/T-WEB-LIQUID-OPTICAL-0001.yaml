  - version: 0.3.0-alpha.1
    change: revised
    summary: Add opt-in style-fill profile bounds, ownership and fixed-source optical tint controls without changing neutral shader semantics.
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Added bounded V2 Web ownership and source checks with actual GPU evidence explicitly pending.
