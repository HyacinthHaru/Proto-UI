id: T-SHADCN-TABS-CONTENT-0001
type: test
title: Shadcn Tabs Content delta protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Content identity, Base panel inheritance, current and hidden projection, current surface, asChild omission, and bounded upstream parity.
cases:
  - id: T-SHADCN-TABS-CONTENT-0001-CASE-IDENTITY-AND-INHERITANCE
    title: Content is a named direct entry that inherits Base panel behavior
    covers:
      [
        P-SHADCN-TABS-CONTENT-UPSTREAM-IDENTITY,
        P-SHADCN-TABS-CONTENT-BASE-INHERITANCE,
        P-SHADCN-TABS-CONTENT-CURRENT-BASE-DEVIATIONS,
        P-SHADCN-TABS-CONTENT-DIRECT-ENTRY,
      ]
    expectation: shadcn-tabs-content-inherits-base-panel-presence
  - id: T-SHADCN-TABS-CONTENT-0001-CASE-SURFACE-AND-COMPATIBILITY
    title: current and hidden state project the current panel while remaining upstream parity stays outside the claim
    covers:
      [
        P-SHADCN-TABS-CONTENT-CURRENT-VISUAL-SURFACE,
        P-SHADCN-TABS-CONTENT-HIDDEN-PROJECTION,
        P-SHADCN-TABS-CONTENT-COMPATIBILITY-SUBSET,
        P-SHADCN-TABS-CONTENT-AS-CHILD-OMISSION,
      ]
    expectation: shadcn-tabs-content-current-panel-with-bounded-presence-parity
  - id: T-SHADCN-TABS-CONTENT-0001-CASE-WC-REMATERIALIZATION
    title: Web Component content rematerializes after selection returns and clears stale hidden projection
    covers:
      [
        P-SHADCN-TABS-CONTENT-BASE-INHERITANCE,
        P-SHADCN-TABS-CONTENT-CURRENT-BASE-DEVIATIONS,
        P-SHADCN-TABS-CONTENT-HIDDEN-PROJECTION,
      ]
    expectation: shadcn-tabs-content-wc-rematerializes-with-current-a11y-state
implementations:
  - id: prototypes-shadcn-tabs-content-contract
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/tabs.test.ts
    required: true
    consumesCases:
      [
        T-SHADCN-TABS-CONTENT-0001-CASE-IDENTITY-AND-INHERITANCE,
        T-SHADCN-TABS-CONTENT-0001-CASE-SURFACE-AND-COMPATIBILITY,
      ]
    exercises: [P-SHADCN-TABS-CONTENT, P-BASE-TABS-CONTENT]
    notes:
      - Positive tests cover context-derived current state, inactive host hiding, selection switching, and current tokens; forceMount mapping and exact parity remain bounded by the centralized question.
  - id: adapter-web-component-shadcn-tabs-content-rematerialization
    kind: adapter-test
    status: passing
    path: packages/adapters/web-component/test/tabs.test.ts
    required: true
    consumesCases:
      - T-SHADCN-TABS-CONTENT-0001-CASE-WC-REMATERIALIZATION
    exercises: [P-SHADCN-TABS-CONTENT, P-BASE-TABS-CONTENT]
verifies:
  prototypes:
    - id: P-SHADCN-TABS-CONTENT
      anchors:
        [
          P-SHADCN-TABS-CONTENT-UPSTREAM-IDENTITY,
          P-SHADCN-TABS-CONTENT-BASE-INHERITANCE,
          P-SHADCN-TABS-CONTENT-CURRENT-BASE-DEVIATIONS,
          P-SHADCN-TABS-CONTENT-DIRECT-ENTRY,
          P-SHADCN-TABS-CONTENT-CURRENT-VISUAL-SURFACE,
          P-SHADCN-TABS-CONTENT-HIDDEN-PROJECTION,
          P-SHADCN-TABS-CONTENT-COMPATIBILITY-SUBSET,
          P-SHADCN-TABS-CONTENT-AS-CHILD-OMISSION,
        ]
exercises:
  prototypes: [P-SHADCN-TABS-CONTENT, P-BASE-TABS-CONTENT]
revisions:
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added Shadcn Tabs Content delta coverage.
tags: [prototype, shadcn, tabs, content, delta, compatibility, test]
