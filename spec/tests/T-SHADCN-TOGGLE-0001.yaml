id: T-SHADCN-TOGGLE-0001
type: test
title: Shadcn Toggle delta protocol contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Shadcn Toggle's reversible Base inheritance, current absence of Base-behavior reversals, direct entry, visual API, state-driven styles, intentional asChild omission, and centralized upstream compatibility boundary.
cases:
  - id: T-SHADCN-TOGGLE-0001-CASE-NEW-YORK-RECIPE
    title: Pinned New York dimensions and state palettes in light and dark
    covers: [P-SHADCN-TOGGLE-NEW-YORK-RECIPE]
    expectation: exact-pinned-size-variant-state-recipe-with-native-evidence-separate
  - id: T-SHADCN-TOGGLE-0001-CASE-CONTENT-SELECTION
    title: Action subject suppresses accidental label selection while activation is retained
    covers: [P-SHADCN-TOGGLE-CONTENT-SELECTION]
    expectation: explicit-action-policy-without-replacing-toggle-state
  - id: T-SHADCN-TOGGLE-0001-CASE-IDENTITY-AND-INHERITANCE
    title: Shadcn Toggle is a direct unofficial projection that inherits Base Toggle
    covers:
      - P-SHADCN-TOGGLE-UPSTREAM-IDENTITY
      - P-SHADCN-TOGGLE-BASE-INHERITANCE
      - P-SHADCN-TOGGLE-CURRENT-BASE-DEVIATIONS
      - P-SHADCN-TOGGLE-DIRECT-ENTRY
    expectation: shadcn-toggle-direct-entry-inherits-as-toggle-protocol
  - id: T-SHADCN-TOGGLE-0001-CASE-VARIANT-AND-SIZE
    title: current variant and size props project the passing visual token subset
    covers:
      - P-SHADCN-TOGGLE-VARIANT-PROP
      - P-SHADCN-TOGGLE-SIZE-PROP
    expectation: shadcn-toggle-current-variant-and-size-matrix
  - id: T-SHADCN-TOGGLE-0001-CASE-STATE-DRIVEN-STYLES
    title: inherited Toggle facts drive active hover focus and disabled visual rules
    covers:
      - P-SHADCN-TOGGLE-STATE-DRIVEN-STYLES
    expectation: shadcn-toggle-styles-derive-from-base-toggle-facts
  - id: T-SHADCN-TOGGLE-0001-CASE-COMPATIBILITY-SUBSET
    title: intentional asChild omission and remaining upstream gaps stay outside the passing claim
    covers:
      - P-SHADCN-TOGGLE-COMPATIBILITY-SUBSET
      - P-SHADCN-TOGGLE-AS-CHILD-OMISSION
    expectation: shadcn-toggle-does-not-overclaim-upstream-parity
implementations:
  - id: prototypes-shadcn-toggle-new-york
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/toggle-new-york.test.ts
    required: true
    consumesCases: [T-SHADCN-TOGGLE-0001-CASE-NEW-YORK-RECIPE]
    exercises: [P-SHADCN-TOGGLE, P-BASE-TOGGLE]
    notes:
      - Fixed upstream recipe is independently asserted; baseline fails and candidate passes. Runtime tokens and physical CSS declarations are not native pixel evidence. The public browser fixture is pending hosted execution and does not expand this passing claim.
  - id: website-shadcn-toggle-new-york-native
    kind: adapter-test
    status: planned
    path: apps/www/src/content/docs/zh-cn/finf-shadcn-toggle.browser.test.ts
    required: true
    consumesCases: [T-SHADCN-TOGGLE-0001-CASE-NEW-YORK-RECIPE]
    exercises: [P-SHADCN-TOGGLE, P-BASE-TOGGLE]
    notes:
      - Official exact-head representative-feature workflow owns four runtime cases with two themes each. Actual dimensions, normalized native colors, outline, active, and disabled facts plus source-bound PNG/JSON remain unexecuted until hosted verification. Unit passing does not fulfill this native implementation.
  - id: prototypes-shadcn-toggle-contract
    kind: module-test
    status: passing
    path: packages/prototypes/shadcn/test/toggle.test.ts
    required: true
    consumesCases:
      - T-SHADCN-TOGGLE-0001-CASE-CONTENT-SELECTION
      - T-SHADCN-TOGGLE-0001-CASE-IDENTITY-AND-INHERITANCE
      - T-SHADCN-TOGGLE-0001-CASE-VARIANT-AND-SIZE
      - T-SHADCN-TOGGLE-0001-CASE-STATE-DRIVEN-STYLES
      - T-SHADCN-TOGGLE-0001-CASE-COMPATIBILITY-SUBSET
    exercises: [P-SHADCN-TOGGLE, P-BASE-TOGGLE]
    notes:
      - Positive tests cover only the current Proto UI guarantee; asChild omission is governed by D-AS-CHILD-OMISSION-0001, while remaining upstream gaps are covered through declared prop enums, source review, and the single catalog-visible compatibility question.
verifies:
  prototypes:
    - id: P-SHADCN-TOGGLE
      anchors:
        - P-SHADCN-TOGGLE-NEW-YORK-RECIPE
        - P-SHADCN-TOGGLE-CONTENT-SELECTION
        - P-SHADCN-TOGGLE-UPSTREAM-IDENTITY
        - P-SHADCN-TOGGLE-BASE-INHERITANCE
        - P-SHADCN-TOGGLE-CURRENT-BASE-DEVIATIONS
        - P-SHADCN-TOGGLE-VARIANT-PROP
        - P-SHADCN-TOGGLE-SIZE-PROP
        - P-SHADCN-TOGGLE-STATE-DRIVEN-STYLES
        - P-SHADCN-TOGGLE-COMPATIBILITY-SUBSET
        - P-SHADCN-TOGGLE-AS-CHILD-OMISSION
exercises:
  prototypes: [P-SHADCN-TOGGLE, P-BASE-TOGGLE]
revisions:
  - version: 0.3.0-alpha.1
    change: revised
    summary: Added fixed New York recipe assertions and public native evidence fixture while retaining action-subject selection and inherited Toggle behavior coverage.
  - version: 0.2.0-rc.0
    change: introduced
    summary: Added delta-style Shadcn Toggle coverage for reversible Base inheritance, current visual API, inherited state-driven styles, intentional asChild omission, and centralized upstream compatibility differences.
tags: [prototype, shadcn, toggle, delta, compatibility, test]
