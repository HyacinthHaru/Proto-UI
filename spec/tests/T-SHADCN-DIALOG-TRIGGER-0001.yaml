id: T-SHADCN-DIALOG-TRIGGER-0001
type: test
title: Shadcn Dialog Trigger semantic-wrapper contract tests
status: draft
since: 0.2.0-rc.0
summary: Covers Trigger Base command inheritance, its unstyled surface, nested trigger composition, asChild omission, and bounded upstream compatibility.
cases:
  - id: T-SHADCN-DIALOG-TRIGGER-0001-CASE-CURRENT-PROTOCOL
    title: Trigger opens the inherited dialog without prescribing Button visuals
    covers:
      [
        P-SHADCN-DIALOG-TRIGGER-UPSTREAM-IDENTITY,
        P-SHADCN-DIALOG-TRIGGER-BASE-INHERITANCE,
        P-SHADCN-DIALOG-TRIGGER-CURRENT-BASE-DEVIATIONS,
        P-SHADCN-DIALOG-TRIGGER-DIRECT-ENTRY,
        P-SHADCN-DIALOG-TRIGGER-UNSTYLED-SURFACE,
        P-SHADCN-DIALOG-TRIGGER-COMPOSITION-BOUNDARY,
        P-SHADCN-DIALOG-TRIGGER-COMPATIBILITY-SUBSET,
        P-SHADCN-DIALOG-TRIGGER-AS-CHILD-OMISSION,
      ]
    expectation: shadcn-dialog-trigger-current-open-command-without-default-button-surface
  - id: T-SHADCN-DIALOG-TRIGGER-0001-CASE-NESTED-ADAPTER-FOCUS
    title: Nested Button supplies one stable pointer and keyboard interaction surface across adapters
    covers:
      [
        P-SHADCN-DIALOG-TRIGGER-COMPOSITION-BOUNDARY,
        D-TRIGGER-GROUP-SURFACE-0001-F,
        D-TRIGGER-GROUP-SURFACE-0001-G,
      ]
    expectation: nested-button-click-opens-and-trapped-tab-retains-visible-focus-and-return-target
implementations:
