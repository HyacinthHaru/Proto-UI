id: T-BASE-TEXTAREA-0001
type: test
title: Base Textarea protocol behavior tests
status: draft
since: 0.2.0-rc.5
summary: Web Component integration coverage for real multi-line editing, Native Control projection, controlled composition, and keyboard preservation.
cases:
  - id: T-BASE-TEXTAREA-0001-CASE-MULTILINE
    title: Real textarea preserves multiline editing and Enter line breaks
    covers:
      - P-BASE-TEXTAREA-REAL-HOST-EDITING
      - P-BASE-TEXTAREA-NATIVE-KEYBOARD
    expectation: native-textarea-preserves-line-break-editing
  - id: T-BASE-TEXTAREA-0001-CASE-CONTROLLED-COMPOSITION
    title: Controlled textarea preserves IME composition before restoration
    covers:
      - P-BASE-TEXTAREA-CONTROLLED-VALUE
    expectation: controlled-textarea-restores-after-compositionend
  - id: T-BASE-TEXTAREA-0001-CASE-PROJECTION
    title: Textarea native properties including rows and wrap project
    covers:
      - P-BASE-TEXTAREA-HOST-PROJECTION
    expectation: textarea-properties-project-through-native-control
  - id: T-BASE-TEXTAREA-0001-CASE-NO-RESIZE
    title: Base Textarea defines no visual resize policy
    covers:
      - P-BASE-TEXTAREA-NO-RESIZE-POLICY
    expectation: base-textarea-remains-style-neutral
exercises:
  prototypes:
    - P-BASE-TEXTAREA
  modules:
    - M-NATIVE-CONTROL-0001
  hostCaps:
    - HC-NATIVE-CONTROL-0001
sources:
  - path: packages/prototypes/base/test/textarea.test.ts
revisions:
  - version: 0.2.0-rc.5
    change: introduced
    summary: Added executable Base Textarea protocol coverage.
tags:
  - base
  - textarea
  - test
