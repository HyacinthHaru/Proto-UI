id: T-BASE-SCROLL-AREA-0001
type: test
title: Base Scroll Area metrics and thumb contract tests
status: draft
since: 0.2.0-rc.7
summary: Covers host-derived metrics, exact bidirectional Thumb ratios, bounded drag mapping, and drag termination.
cases:
  - id: T-BASE-SCROLL-AREA-0001-CASE-METRICS
    title: Viewport publishes all host scroll and client metrics
    covers:
      - P-BASE-SCROLL-AREA-VIEWPORT-METRICS
      - P-BASE-SCROLL-AREA-VIEWPORT-REQUEST
    expectation: viewport-host-metrics-and-versioned-request
  - id: T-BASE-SCROLL-AREA-0001-CASE-THUMB-RATIO
    title: Thumb ratios are exact and finite in both orientations
    covers:
      - P-BASE-SCROLL-AREA-BEHAVIOR-BOUNDARY
      - P-BASE-SCROLL-AREA-THUMB-RATIOS
    expectation: thumb-exact-bidirectional-ratios
  - id: T-BASE-SCROLL-AREA-0001-CASE-THUMB-DRAG
    title: Thumb drag maps available travel to clamped axis requests and terminates
    covers:
      - P-BASE-SCROLL-AREA-BEHAVIOR-BOUNDARY
      - P-BASE-SCROLL-AREA-THUMB-DRAG
    expectation: thumb-bidirectional-bounded-drag
implementations:
  - id: prototypes-base-scroll-area-contract
    kind: module-test
    status: passing
    path: packages/prototypes/base/test/scroll-area.test.ts
    required: true
    consumesCases:
      - T-BASE-SCROLL-AREA-0001-CASE-METRICS
      - T-BASE-SCROLL-AREA-0001-CASE-THUMB-RATIO
      - T-BASE-SCROLL-AREA-0001-CASE-THUMB-DRAG
    exercises:
      - P-BASE-SCROLL-AREA
      - P-BASE-SCROLL-AREA-VIEWPORT
      - P-BASE-SCROLL-AREA-THUMB
sources:
  - path: packages/prototypes/base/test/scroll-area.test.ts
  - path: packages/prototypes/base/src/scroll-area/viewport.proto.ts
  - path: packages/prototypes/base/src/scroll-area/thumb.proto.ts
exercises:
  prototypes:
    - P-BASE-SCROLL-AREA
    - P-BASE-SCROLL-AREA-VIEWPORT
    - P-BASE-SCROLL-AREA-THUMB
revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: Added Base Scroll Area metrics and thumb behavior coverage.
tags:
  - prototype
  - base
  - scroll-area
  - test
