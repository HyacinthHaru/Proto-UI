id: T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001
type: test
title: ToggleGroup request retirement and queued notification regression
status: draft
since: 0.3.0-alpha.1
lifecycleRationale:
  en: Bounded RuntimeSession coverage with synthetic hosts; exact-source native, Compiler composition and independent admission remain separate.
summary: Preserve accepted request returns while retiring old view notifications and keeping finite reentrant proposal delivery ordered.
cases:
  - id: T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-LIFETIME
    title: Synchronous Context retirement
    covers: [P-BASE-TOGGLE-GROUP-REQUEST-RETIREMENT]
    expectation: Normal requests emit once. Unmount, disposal or unmount followed by remount during Context publication prevents the old request notification without changing its accepted true return. A current request after remount remains usable. A created Root that has never mounted also retires its owner before terminal disposal, while live item membership is observed through the existing collection query.
  - id: T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-QUEUED
    title: Queued Context observers retain the retirement boundary
    covers: [P-BASE-TOGGLE-GROUP-REQUEST-RETIREMENT, P-BASE-TOGGLE-GROUP-NOTIFICATION-ORDER]
    expectation: Requests entered from the same Root Context delivery wait for its synchronous publication chain. Normal A delivers A; nested A to B to C delivers queued B then C before the outer A tail. Queued unmount, disposal or remount suppresses all retired tails; a fresh remount request remains usable.
  - id: T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-REENTRY
    title: Reentry during notification drain joins the existing queue
    covers: [P-BASE-TOGGLE-GROUP-NOTIFICATION-ORDER]
    expectation: With B and C already queued, B's valueChange callback may accept D. Delivery is B then C then D before the outer A tail; D must not overtake C. Accepted returns remain true and current logical selection is D.
  - id: T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-CALLBACK-ERROR
    title: Accepted nested notification survives a later Context error
    covers: [P-BASE-TOGGLE-GROUP-NOTIFICATION-ORDER]
    expectation: An early Context subscriber may accept nested B before a later subscriber throws an Error during A. After Context drains A and B, B's current notification is delivered before the original Error escapes. The throwing outer A call does not gain a notification, and the original Error identity is preserved.
verifies:
  prototypes:
    - id: P-BASE-TOGGLE-GROUP
      anchors: [P-BASE-TOGGLE-GROUP-REQUEST-RETIREMENT, P-BASE-TOGGLE-GROUP-NOTIFICATION-ORDER]
implementations:
  - id: toggle-group-runtime-retirement
    kind: runtime-test
    status: needs-review
    path: packages/prototypes/base/test/notification-retirement-lifecycle.test.ts
    required: true
    exercises: [P-BASE-TOGGLE-GROUP]
    consumesCases:
      - T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-LIFETIME
      - T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-QUEUED
      - T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-REENTRY
      - T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-CASE-CALLBACK-ERROR
    notes:
      - Fourteen Toggle Group cases cover five direct Context paths, five queued Context paths, one notification-drain reentry, two never-mounted owner controls and one accepted-notification callback-error path. The file also covers other prototypes; only its Toggle Group cases implement this entity. Synthetic RuntimeSession checks do not establish native focus, geometry, assistive-technology or complete Adapter conformance.
sources:
  - path: packages/prototypes/base/src/toggle-group/root.proto.ts
exercises:
  prototypes: [P-BASE-TOGGLE-GROUP]
openQuestions:
  - id: T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001-Q-ADMISSION
    question:
      en: When do exact-source native and Compiler composition and independent review support admission of this bounded lifecycle slice?
    blocks: [activation:T-TOGGLE-GROUP-REQUEST-RETIREMENT-0001]
revisions:
  - version: 0.3.0-alpha.1
    change: introduced
    summary: Map existing retirement controls and a same-test-byte FIFO regression without claiming full ToggleGroup admission.
tags: [test, toggle-group, lifecycle, reentrancy]
