id: HC-NATIVE-CONTROL-0001
type: host-cap
title: Host can lease a physical native control
status: draft
since: 0.2.0-rc.5
summary: The host can attach one bounded Native Control lease to an adapter-owned physical target.
statement:
  zh-CN: >-
    Host 可以把 Native Control portable patch 投影到 adapter-owned physical target，标准化该 target 的编辑事件，并返回可 update、snapshot 与 dispose 的 mount-epoch lease。

  en: >-
    The host can project a Native Control portable patch to an adapter-owned physical target, normalize that target's editing events, and return a mount-epoch lease that can be updated, inspected, and disposed.

satisfies:
  contracts:
    - C-NATIVE-CONTROL-0001
verifies:
  tests:
    - T-NATIVE-CONTROL-0001
sources:
  - path: packages/modules/native-control/src/caps.ts
  - path: packages/modules/native-control/src/web.ts
revisions:
  - version: 0.2.0-rc.5
    change: introduced
    summary: Cataloged the Native Control host lease.
tags:
  - native-control
  - host-capability
