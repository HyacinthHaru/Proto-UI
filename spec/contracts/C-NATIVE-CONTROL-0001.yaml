id: C-NATIVE-CONTROL-0001
type: contract
title: Native controls use adapter-owned physical targets
status: draft
since: 0.2.0-rc.5
summary: Native Control projects portable editing intent through adapter-owned physical controls without widening Template v0.
statement:
  zh-CN: >-
    Native Control 必须通过 prototype 的静态 module declaration 在首次 render 前选择 adapter-owned physical control，并以可移植 patch、标准化编辑事件和有界 host lease 投影控件语义。Template Node 不获得 attributes、properties、events 或 component channels。

  en: >-
    Native Control must select an adapter-owned physical control before first render through a prototype static module declaration and project control semantics through portable patches, normalized editing events, and a bounded host lease. Template Nodes do not gain attributes, properties, events, or component channels.

criteria:
  - id: C-NATIVE-CONTROL-0001-A
    text:
      zh-CN: Static declaration 必须在首次 render 前选择 physical control，且不得要求应用重复提供 adapter 选项。
      en: The static declaration must select the physical control before first render without requiring repeated application adapter options.
  - id: C-NATIVE-CONTROL-0001-B
    text:
      zh-CN: value、defaultValue、disabled、readOnly、required、fieldName、controlType、placeholder、autoComplete、minLength、maxLength、rows 与 wrap 必须通过 portable patch 投影。
      en: value, defaultValue, disabled, readOnly, required, fieldName, controlType, placeholder, autoComplete, minLength, maxLength, rows, and wrap must project through a portable patch.
  - id: C-NATIVE-CONTROL-0001-C
    text:
      zh-CN: input、change 与 composition 事件必须标准化并按原生顺序投递；native event object 仅是 host-local escape hatch。
      en: input, change, and composition events must be normalized and delivered in native order; the native event object is only a host-local escape hatch.
  - id: C-NATIVE-CONTROL-0001-D
    text:
      zh-CN: Controlled value 必须在 callback 完成后恢复，composition 期间不得破坏 IME；uncontrolled dirty value 必须由 logical instance 保留。
      en: A controlled value must be restored after callback completion without disrupting IME during composition; an uncontrolled dirty value must be retained by the logical instance.
  - id: C-NATIVE-CONTROL-0001-E
    text:
      zh-CN: Host target、listener 与 pending host work 必须受 mount epoch lease 约束并在 detach/dispose 时撤销。
      en: Host targets, listeners, and pending host work must be bounded by a mount-epoch lease and revoked on detach or disposal.
  - id: C-NATIVE-CONTROL-0001-F
    text:
      zh-CN: Template v0 必须保持 structural 且 style-only；Web Component 的 inner native control 属于 adapter infrastructure，不属于 Template children。
      en: Template v0 must remain structural and style-only; a Web Component inner native control is adapter infrastructure, not a Template child.
