id: C-FEEDBACK-STYLE-0004
type: contract
title: Author style tokens exclude state selectors and allow one static selection surface
status: draft
since: 0.1.0
summary: Prototype-author-side `feedback.style` tokens must describe style only and must not encode state, event, selector, or host-realization dependencies.
statement:
  zh-CN: >-
    原型作者写入 `feedback.style` 的 style token 必须只表达样式意图，不得混入 Proto UI state、event、host state selector 或宿主实现依赖。当前 v0 token 禁止 `:`，唯一例外是单一前缀 `selection:<style-token>`，用于将静态样式作用于宿主原生文本选择 pseudo-element；例如 `selection:bg-primary`。该例外不得嵌套、组合其他 variant、查询宿主状态或编写任意 selector。通路纯度依然是语义约束，而不只是 parser 限制。


  en: >-
    Style tokens authored into `feedback.style` must express style intent without encoding Proto UI state, events, host-state selectors, or host-realization dependencies. Current v0 tokens forbid `:` with one exception: a single `selection:<style-token>` prefix applies a static style to the host's native text-selection pseudo-element, for example `selection:bg-primary`. The exception cannot be nested, combined with another variant, used to query host state, or used to author arbitrary selectors. Channel purity remains a semantic constraint, not merely a parser limitation.


criteria:
  - id: C-FEEDBACK-STYLE-0004-A
    text:
      zh-CN: 作者侧 style token 不得包含 `:`，唯一允许的形式是单一前缀 `selection:<style-token>`；该前缀只指向宿主原生文本选择 pseudo-element，不能嵌套或与其他 variant 组合。
      en: Author-side style tokens must not contain `:` except for one `selection:<style-token>` prefix; this prefix targets only the host's native text-selection pseudo-element and cannot be nested or combined with another variant.
  - id: C-FEEDBACK-STYLE-0004-B
    text:
      zh-CN: 除 C-FEEDBACK-STYLE-0004-A 明确允许的静态文本选择 pseudo-element 外，作者侧 token 不得直接表达 hover、active、focus、disabled、data attribute、ARIA 或任意 selector/state/event 依赖。
      en: Except for the static text-selection pseudo-element explicitly allowed by C-FEEDBACK-STYLE-0004-A, author-side tokens must not directly express hover, active, focus, disabled, data-attribute, ARIA, or arbitrary selector/state/event dependencies.
  - id: C-FEEDBACK-STYLE-0004-C
    text:
      zh-CN: Proto UI 状态化视觉反馈应通过 state、context、props 或其他信息通路与 rule 等独立 API 组合表达；固定的 `selection:` 样式不得携带 Proto UI 状态条件。
      en: Proto UI stateful visual feedback should compose state, context, props, or other information channels with independent APIs such as rule; the fixed `selection:` style must not carry a Proto UI state condition.
  - id: C-FEEDBACK-STYLE-0004-D
    text:
      zh-CN: Adapter 或翻译层可以生成带状态、selector 或平台特定结构的最终样式产物；这些最终产物不受作者侧 style token 语法约束，也不等同于原型内部作者侧 style token。
      en: Adapters or translation layers can generate final style artifacts with state, selectors, or platform-specific structure; those final artifacts are not constrained by author-side style-token syntax and are not equivalent to prototype-internal author-side style tokens.
  - id: C-FEEDBACK-STYLE-0004-E
    text:
      zh-CN: 因非法 token 语法导致的失败必须同步、确定性地抛错。
      en: Failures caused by illegal token syntax must throw synchronously and deterministically.
  - id: C-FEEDBACK-STYLE-0004-F
    text:
      zh-CN: >-
        `selection:` 后必须是一个合法的无 variant style token；任意 selector、嵌套 variant 与 `selection` 之外的冒号形式仍必须同步拒绝。


      en: >-
        `selection:` must be followed by one valid unvarianted style token; arbitrary selectors, nested variants, and every colon form other than `selection` must still be rejected synchronously.


