    change: refined
    summary: Clarified entry-role pending cancellation and non-resurrection independently of target-role eligibility.
  - version: 0.1.0
    change: introduced
    summary: Added asFocusEntry as the first focus entry region hook for descendant-first tabpanel behavior.
