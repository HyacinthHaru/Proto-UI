revisions:
  - version: 0.2.0-rc.3
    change: introduced
    summary: Kept default part materialization outside Anatomy and defined deterministic three-state replacement with raw-facade escape hatches.
  - version: 0.2.0-rc.5
    change: revised
    summary: Required generated default parts to connect only after the owning Root context exists, without failure-driven remount recovery.
tags: [component-preset, materialization, cli, adapter, anatomy, composition]
