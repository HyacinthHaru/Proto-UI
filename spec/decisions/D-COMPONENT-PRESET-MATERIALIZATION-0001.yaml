id: D-COMPONENT-PRESET-MATERIALIZATION-0001
type: decision
title: Component presets materialize replaceable defaults outside Anatomy
status: draft
since: 0.2.0-rc.3
summary: Component presets declare deterministic replaceable default parts that CLI or adapters mount once in the owning Root context before Anatomy validates the resulting real structure.
statement:
  zh-CN: >-
    Proto UI 可以为常规消费提供 component preset，但 preset 必须是独立于 Anatomy 的确定性 composition recipe。Prototype library 声明默认 part identity 与替换策略，CLI 或 adapter materializer 必须在候选 part 挂载前解析默认、显式替换或显式关闭，并使最终 part 在 Root 的同一 materialization context 中只挂载一次；Anatomy 只观察并验证最终真实存在的 parts，不得创建、移动、卸载或自动补全结构。Raw prototype facades 必须继续可用，使 App Maker 能绕过 convenience preset 进行完整显式组合。


  en: >-
    Proto UI may provide component presets for ordinary consumption, but a preset must be a deterministic composition recipe independent of Anatomy. The prototype library declares default-part identities and replacement policy, while a CLI or adapter materializer resolves default, explicit replacement, or explicit omission before any candidate part mounts and mounts the resulting part exactly once in the Root's materialization context. Anatomy only observes and validates the resulting real parts and must not create, move, unmount, or automatically complete structure. Raw prototype facades remain available so App Makers can bypass convenience presets for fully explicit composition.


criteria:
  - id: D-COMPONENT-PRESET-MATERIALIZATION-0001-A
    text:
      zh-CN: Anatomy diagnostics、cardinality 与 PartView 不得触发默认 part 创建或宿主树改写。
      en: Anatomy diagnostics, cardinality, and PartView must not trigger default-part creation or host-tree mutation.
  - id: D-COMPONENT-PRESET-MATERIALIZATION-0001-B
    text:
      zh-CN: 默认 part 必须从 Root 的 materialization context 确定性解析，不得依赖最近一次运行、全局 last-used state 或 render 期间重新 adapt prototype。
      en: Default parts must resolve deterministically from the Root's materialization context and must not depend on recent runs, global last-used state, or adapting prototypes again during render.
  - id: D-COMPONENT-PRESET-MATERIALIZATION-0001-C
    text:
      zh-CN: Replaceable default part 必须区分未提供、显式兼容替换与显式关闭三种输入，并在任何候选 part 挂载前完成解析。
      en: A replaceable default part must distinguish absent input, an explicit compatible replacement, and explicit omission, resolving before any candidate part mounts.
  - id: D-COMPONENT-PRESET-MATERIALIZATION-0001-D
    text:
      zh-CN: 自动替换只要求识别 preset 声明的具名输入或可静态识别的直接 part；隐藏在不透明用户组件中的后代不得要求 materializer 猜测。
      en: Automatic replacement only needs to recognize named preset inputs or statically identifiable direct parts; the materializer must not guess about descendants hidden inside opaque user components.
  - id: D-COMPONENT-PRESET-MATERIALIZATION-0001-E
    text:
      zh-CN: Convenience preset 与 raw Root/part facades 必须同时保留，且 preset 产物必须通过对应 anatomy family/profile validation。
      en: The convenience preset and raw Root/part facades must coexist, and preset output must pass the corresponding anatomy family or profile validation.
  - id: D-COMPONENT-PRESET-MATERIALIZATION-0001-F
    text:
      zh-CN: 若宿主生命周期不允许在 constructor 中安全创建默认 part，materializer 可以先建立 Root runtime/context 再连接已解析的默认 part；不得让默认 part 先连接后再补建其 parent context，也不得通过失败后重挂载来恢复。
      en: If a host lifecycle cannot safely create the default part in its constructor, the materializer may establish the Root runtime and context before connecting the already-resolved default part; it must not connect the default part before creating its parent context or recover by remounting after failure.
