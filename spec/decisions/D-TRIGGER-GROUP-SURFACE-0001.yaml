id: D-TRIGGER-GROUP-SURFACE-0001
type: decision
title: Continuous triggers share behavior ownership and one host interaction surface
status: draft
since: 0.2.0-rc.3
summary: Continuous trigger chains retain one outer behavior route while projecting focus and accessibility through one default inner host surface.
statement:
  zh-CN: >-
    连续嵌套且均声明 `asTrigger()` 的 prototype instances 必须形成同一个 trigger group。最外层连续 trigger 继续作为 behavior owner 汇集 activation/event route；默认最内层连续 trigger 作为 surface owner，承担唯一宿主 focus target 与 accessibility semantic object projection。`asTrigger` 只建立可供 Event、Focus 与 A11y 消费的 group ownership，不反向吞并这些 domain；Focus 可以让 group 成员观察共享 interaction facts，但不得投射多个宿主 focus target，A11y 也不得为同一 trigger group 投射多个 control semantic objects。


  en: >-
    Directly and continuously nested prototype instances that declare `asTrigger()` form one trigger group. The outermost continuous trigger remains the behavior owner that collects the activation and event route, while the innermost continuous trigger is the default surface owner that carries the sole host focus target and accessibility semantic-object projection. `asTrigger` establishes group ownership for Event, Focus, and A11y to consume without absorbing those domains. Focus may let group members observe shared interaction facts but must not project multiple host focus targets, and A11y must not project multiple control semantic objects for one trigger group.


criteria:
  - id: D-TRIGGER-GROUP-SURFACE-0001-A
    text:
      zh-CN: 连续 trigger group 必须区分最外层 behavior owner 与默认最内层 surface owner；两者 identity 可以不同。
      en: A continuous trigger group must distinguish its outermost behavior owner from its default innermost surface owner; those identities may differ.
  - id: D-TRIGGER-GROUP-SURFACE-0001-B
    text:
      zh-CN: Event 必须继续把 group activation route 合并到 behavior owner，不得因 surface projection 改回逐实例 activation。
      en: Event must continue merging the group activation route into the behavior owner and must not regress to per-instance activation because of surface projection.
  - id: D-TRIGGER-GROUP-SURFACE-0001-C
    text:
      zh-CN: Focus 必须为 trigger group 投射至多一个宿主 focus target，并在 focus scope/roving 导航中把共享同一宿主 target 的 group 视为一个成员且优先最内层 surface owner；group 成员可以共享 focused、focusVisible 等事实以驱动各自 feedback。
      en: Focus must project at most one host focus target for a trigger group, treat group members that share that host target as one focus-scope or roving-navigation member, and prefer the innermost surface owner; group members may share facts such as focused and focusVisible for their own feedback.
  - id: D-TRIGGER-GROUP-SURFACE-0001-D
    text:
      zh-CN: A11y 必须为 trigger group 投射至多一个 control semantic object；相同 role/action 可以合并，不兼容声明必须诊断而不是产生重复 controls。
      en: A11y must project at most one control semantic object for a trigger group; compatible roles and actions may merge, while incompatible declarations require diagnostics rather than duplicate controls.
  - id: D-TRIGGER-GROUP-SURFACE-0001-E
    text:
      zh-CN: Trigger group ownership 必须保持 domain-neutral；Event、Focus 与 A11y 消费 ownership，但 `asTrigger` module 不得直接实现这些 domain 的完整策略。
      en: Trigger-group ownership must remain domain-neutral; Event, Focus, and A11y consume the ownership, while the asTrigger module must not directly implement the full policy of those domains.
  - id: D-TRIGGER-GROUP-SURFACE-0001-F
    text:
      zh-CN: Event 的语义 activation listeners 必须汇聚到默认最内层 surface 的 event target，再由最外层 behavior owner 消费；`host:*` listeners 必须留在各实例自己的宿主 root，避免嵌套 Button 吞掉 Trigger/Close 的原生 focus 与 blur 观察。
      en: Event semantic activation listeners must converge on the default innermost surface event target for consumption by the outermost behavior owner; `host:*` listeners must remain on each instance's own host root so a nested Button does not absorb the Trigger or Close native focus and blur observations.
  - id: D-TRIGGER-GROUP-SURFACE-0001-G
    text:
      zh-CN: Trigger ancestry 必须识别规范 hook identity `as-trigger` 或已建立的 logical trigger mark，不得依赖旧的非规范 `asTrigger` trace spelling；pointer 与 keyboard activation 必须落入同一 behavior owner。
      en: Trigger ancestry must recognize the canonical `as-trigger` hook identity or an established logical trigger mark and must not depend on the legacy non-canonical `asTrigger` trace spelling; pointer and keyboard activation must reach the same behavior owner.
