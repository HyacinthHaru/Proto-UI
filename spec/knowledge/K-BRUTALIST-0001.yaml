revisions:
  - version: 0.2.0-rc.7
    change: introduced
    summary: >-
      Extracted the Brutalist design-language provenance statement from the runtime prototype criteria into a knowledge entity, since provenance is not established by a runtime test. Introduced on the rc.7 release train; not present in the immutable rc.6 snapshot.


tags: [knowledge, brutalist, neo-brutalist, design-language, provenance, identity]
