id: V-PROTO-UI-0005
type: version
title: Proto UI 0.2.0-rc.5
status: active
since: 0.2.0-rc.5
summary: Fifth globally exact release candidate fixing Dialog default CloseIcon context initialization and Switch checked-state Thumb movement after external rc.4 trials.
statement:
  en: Proto UI 0.2.0-rc.5 is one ecosystem release identity shared exactly by every public @proto.ui package and the corresponding immutable spec snapshot.
  zh-CN: Proto UI 0.2.0-rc.5 是由全部公开 @proto.ui package 与对应不可变 spec snapshot 精确共享的一次生态发行身份。
release:
  version: 0.2.0-rc.5
  channel: prerelease
  gitTag: v0.2.0-rc.5
  npmDistTag: next
  packageVersionPolicy: exact
  packageScope: public-@proto.ui
  publishedAt: 2026-07-25T06:09:06Z
