id: V-PROTO-UI-0004
type: version
title: Proto UI 0.2.0-rc.4
status: active
since: 0.2.0-rc.4
summary: Fourth globally exact release candidate fixing Web Component Tabs Content rematerialization after external rc.3 trials.
statement:
  en: Proto UI 0.2.0-rc.4 is one ecosystem release identity shared exactly by every public @proto.ui package and the corresponding immutable spec snapshot.
  zh-CN: Proto UI 0.2.0-rc.4 是由全部公开 @proto.ui package 与对应不可变 spec snapshot 精确共享的一次生态发行身份。
release:
  version: 0.2.0-rc.4
  channel: prerelease
  gitTag: v0.2.0-rc.4
  npmDistTag: next
  packageVersionPolicy: exact
  packageScope: public-@proto.ui
  publishedAt: 2026-07-24T12:57:02Z
  commit: d0d9d2a68f9624923faab16132c82eea0b6a3b8b
  specSnapshotDigest: sha256:b88e4c782655e89d3176196c184da1f7b3aab143d019b28334b8c8a1cd83e168
dependsOn:
  decisions:
    - D-GLOBAL-RELEASE-VERSION-0001
criteria:
  - id: V-PROTO-UI-0004-DRAFT-BOUNDARY
    text:
      en: The draft entity may govern aligned rc.4 package manifests, release assets, and catalog references, but it must not claim npm, Git tag, GitHub Release, or immutable snapshot evidence.
      zh-CN: 本 draft 实体可以治理已对齐的 rc.4 package manifest、发行物料与 catalog 引用，但不得声称已存在 npm、Git tag、GitHub Release 或不可变 snapshot 证据。
  - id: V-PROTO-UI-0004-IDENTITY
    text:
      en: Before publication, VERSION, every public @proto.ui package manifest, staged internal dependency versions, and the spec snapshot must be prepared at 0.2.0-rc.4 exactly.
      zh-CN: 发布前，VERSION、全部公开 @proto.ui package manifest、暂存发布包的内部依赖版本以及 spec snapshot 必须统一准备为 0.2.0-rc.4。
  - id: V-PROTO-UI-0004-PUBLICATION
    text:
      en: The entity may become active only after npm publication, the v0.2.0-rc.4 Git tag, and snapshot digest evidence all exist.
      zh-CN: 仅当 npm 发布、v0.2.0-rc.4 Git tag 与 snapshot digest 证据均存在后，本实体才可转为 active。
