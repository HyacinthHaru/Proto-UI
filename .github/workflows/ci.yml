name: CI
run-name: Brutalist dispatch on the original browser shards

# Owned verification ref only. Preserve the original shard selection and
# runtime invocation while keeping the held Search lanes out of this run.
on: workflow_dispatch

jobs:
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard: 1/8
            slot: browser-1-of-8
            trace: '1'
          - shard: 2/8
            slot: browser-2-of-8
            trace: '0'
          - shard: 3/8
            slot: browser-3-of-8
            trace: '0'
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PROTO_UI_RUNTIME_PHASE: browser
      PROTO_UI_RUNTIME_SHARD: ${{ matrix.shard }}
      PROTO_UI_RUNTIME_SLOT: ${{ matrix.slot }}
      PROTO_UI_FAMILY_DISPATCH_PROBE: ${{ matrix.trace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and locate Chromium
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Restore the exact browser font package only
        timeout-minutes: 1
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/homepage-font-cache/fonts-noto-cjk_20230817+repack1-3_all.deb
          key: ubuntu24-fonts-noto-cjk-7d64b985f6fe128c99eae5610d5c047338e572bdcfb2bb09736be01b824a7f6c
      - name: Install real CJK fallback for typography glyph evidence
        # Fail setup before a slow mirror consumes the browser execution budget.
        timeout-minutes: 3
        env:
          FONT_EVIDENCE_DIR: ${{ runner.temp }}/runtime-ci/font-preparation
        run: bash apps/www/scripts/prepare-homepage-composition-fonts.sh
      - name: Disable the development toolbar before public-page browser tests
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
      - name: Run the bounded shard with its own documentation server
        run: |
          set -euo pipefail
          export PROTO_UI_RUNTIME_EVIDENCE_DIR="$RUNNER_TEMP/runtime-ci"
          export PROTO_UI_TYPOGRAPHY_EVIDENCE_DIR="$PROTO_UI_RUNTIME_EVIDENCE_DIR/typography"
          export PROTO_UI_MATERIAL_EVIDENCE_DIR="$PROTO_UI_RUNTIME_EVIDENCE_DIR/material"
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          printf '%s\n' '1c21bcc9ea63100039b32058723feb0e05508258' > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/product-parent.txt"
          node --version | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/node-version.txt"
          "$CHROME_PATH" --version | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/chrome-version.txt"
          # Each matrix job owns an independent checkout, server and Astro cache.
          # Keep room within the job deadline for teardown and artifact retention.
          timeout --signal=TERM --kill-after=10s 900s \
            node scripts/test/run-runtime-tests.mjs 2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
      - name: Record terminal producer outcome
        if: always()
        env:
          RUNTIME_CI_OUTCOME: ${{ job.status }}
        run: node scripts/test/runtime-ci.mjs finish "$RUNNER_TEMP/runtime-ci"
      - name: Preserve source-bound shard selection, results and failure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ci-${{ github.run_id }}-${{ env.PROTO_UI_RUNTIME_SLOT }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-ci
          if-no-files-found: error
          retention-days: 14
