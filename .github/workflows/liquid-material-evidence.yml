name: Liquid Glass material and library evidence
on:
  pull_request:
    paths:
      - '.github/workflows/liquid-material-evidence.yml'
      - 'packages/prototypes/liquid-glass/**'
      - 'packages/prototypes/base/**'
      - 'packages/core/**'
      - 'packages/runtime/**'
      - 'packages/hooks/**'
      - 'packages/modules/**'
      - 'packages/cli/**'
      - 'scripts/test/liquid-material-evidence-inputs.test.mjs'
      - 'scripts/docs/test/liquid-toggle-mdx.test.mjs'
      - 'packages/adapters/**'
      - 'apps/www/src/components/**'
      - 'apps/www/src/content/docs/**/ui-libraries/liquid-glass/**'
      - 'apps/www/src/content/docs/**/ui-libraries/bootstrap-2-3-2/**'
      - 'apps/www/src/content/docs/zh-cn/demo-liquid-glass-material.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/demo-liquid-glass-toggle.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-failure-diagnostics.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-failure-diagnostics.test.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-tint-probe.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-detail-metrics.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-detail-metrics.test.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-detail-probe.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-detail-probe.test.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-snapshot.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-toggle-snapshot.test.ts'
      - 'apps/www/scripts/diagnose-select-click.ts'
      - 'apps/www/src/content/docs/demo_components/liquid-glass/**'
      - 'apps/www/src/content/docs/zh-cn/browser-harness.ts'
      - 'apps/www/astro.config.mjs'
      - 'apps/www/src/styles/**'
      - 'scripts/styles/**'
      - 'scripts/test/server-readiness.mjs'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'apps/www/src/content/docs/zh-cn/bootstrap-disabled-paint.ts'
      - 'apps/www/src/content/docs/zh-cn/material-paint-observation.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-material-observation.ts'
      - 'apps/www/src/content/docs/zh-cn/public-portal-diagnostic.ts'
      - 'apps/www/src/content/docs/zh-cn/material-paint-observation.test.ts'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - 'apps/www/src/pages/en/test/liquid-glass-material.astro'
      - 'apps/www/src/content/docs/demo-liquid-glass-dropdown-menu.demo.ts'
      - 'apps/www/src/content/docs/zh-cn/demo-liquid-glass-portal.browser.test.ts'
      - 'apps/www/src/pages/en/test/liquid-glass-portal.astro'
      - 'apps/www/src/pages/en/test/liquid-glass-toggle.astro'
      - 'apps/www/src/pages/en/test/liquid-glass-hover.astro'
      - 'apps/www/src/content/docs/zh-cn/demo-liquid-glass-hover.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-hover-*'
      - 'apps/www/src/pages/en/test/liquid-glass-prominent-tint.astro'
      - 'apps/www/src/content/docs/zh-cn/demo-liquid-glass-prominent-tint.browser.test.ts'
      - 'apps/www/src/content/docs/zh-cn/liquid-prominent-tint-*'
      - 'spec/contracts/C-LIQUID-GLASS-MAIN-COMMAND-TINT-0001.yaml'
      - 'spec/tests/T-LIQUID-GLASS-MAIN-COMMAND-TINT-0001.yaml'
      - 'spec/prototypes/P-LIQUID-GLASS-BUTTON.yaml'
      - 'spec/tests/T-LIQUID-GLASS-BUTTON-0001.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liquid-material-evidence-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Source closure and real material/library evidence
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-material-evidence
        run: |
          node --test scripts/test/liquid-material-evidence-inputs.test.mjs scripts/docs/test/liquid-toggle-mdx.test.mjs
          node scripts/build/generate-web-material-kernel.mjs --check
          corepack pnpm@10.32.1 check:styles:preset
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/liquid-glass/test/material.test.ts \
            packages/prototypes/liquid-glass/test/toggle.test.ts \
            packages/prototypes/liquid-glass/test/interactive-surface.test.ts \
            packages/prototypes/liquid-glass/test/accordion-material.test.ts \
            packages/prototypes/liquid-glass/test/collapsible-material.test.ts \
            packages/prototypes/liquid-glass/test/dropdown-material.test.ts \
            packages/prototypes/liquid-glass/test/select-material.test.ts \
            packages/adapters/base/test/portal-destination.test.ts \
            packages/adapters/base/test/portal-inline-size.test.ts \
            packages/adapters/base/test/web-material-program.test.ts \
            packages/adapters/base/test/web-material-preferences-sequence.test.ts \
            packages/adapters/base/test/web-material-style-tint.test.ts \
            packages/adapters/base/test/web-material-style.test.ts \
            packages/adapters/base/test/web-material-source.test.ts \
            packages/adapters/base/test/web-material-sink.test.ts \
            apps/www/src/content/docs/zh-cn/material-paint-observation.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-failure-diagnostics.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-snapshot.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-detail-metrics.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-toggle-detail-probe.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-fixture.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-plan.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-hover-source-layout.test.ts \
            apps/www/src/components/PrototypePreviewer/demo-renderer.hover-reenable.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-material.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-portal.browser.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-toggle.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-material-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-material-evidence
          if-no-files-found: warn
          retention-days: 30
  prominent-tint-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [wc, react, vue, vue2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Main-command tint source closure and real component evidence
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-prominent-tint-evidence
          PROTO_UI_PROMINENT_TINT_RUNTIME: ${{ matrix.runtime }}
        run: |
          node --test scripts/test/liquid-material-evidence-inputs.test.mjs
          node scripts/build/generate-web-material-kernel.mjs --check
          corepack pnpm@10.32.1 check:styles:preset
          corepack pnpm@10.32.1 exec vitest run \
            packages/prototypes/liquid-glass/test/button.test.ts \
            packages/prototypes/liquid-glass/test/material.test.ts \
            packages/prototypes/liquid-glass/test/interactive-surface.test.ts \
            packages/prototypes/base/test/form-actions-material.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-prominent-tint-fixture.test.ts \
            apps/www/src/content/docs/zh-cn/liquid-prominent-tint-metrics.test.ts \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-prominent-tint.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain exact-source prominent tint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-prominent-tint-${{ matrix.runtime }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-prominent-tint-evidence
          if-no-files-found: warn
          retention-days: 30

  hover-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [wc, react, vue, vue2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Configure official evidence surface
        run: |
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences list
      - name: Retain the complete runtime hover partition
        env:
          PROTO_UI_MATERIAL_EVIDENCE_DIR: ${{ runner.temp }}/liquid-material-evidence
          PROTO_UI_HOVER_RUNTIME: ${{ matrix.runtime }}
        run: |
          corepack pnpm@10.32.1 exec vitest run \
            apps/www/src/content/docs/zh-cn/demo-liquid-glass-hover.browser.test.ts \
            --maxWorkers=1 --minWorkers=1
      - name: Retain exact-source partial and completed hover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-hover-${{ matrix.runtime }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liquid-material-evidence
          if-no-files-found: warn
          retention-days: 30
