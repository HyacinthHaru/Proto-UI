name: Passive atom documentation evidence

on:
  pull_request:
    paths:
      - '.github/workflows/passive-atom-docs-evidence.yml'
      - 'apps/www/**'
      - 'packages/adapters/**'
      - 'packages/prototypes/**'
      - 'packages/cli/**'
      - 'scripts/test/runtime-test-plan.mjs'
      - 'scripts/test/passive-atom-docs-evidence.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      profile_search:
        description: 'Diagnostic only: sample the first Shadcn dark/390 Search load (not performance acceptance)'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: passive-atom-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  public-atom-previews:
    if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.profile_search) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Install and record Chinese glyph coverage
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/passive-atom-evidence"
          {
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig
            fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn'
            fc-list ':lang=zh-cn' family file
          } | tee "$RUNNER_TEMP/passive-atom-evidence/font-environment.txt"
          test -n "$(fc-list ':lang=zh-cn' file)"
      - name: Select real Chromium and supported toolbar setting
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Exercise both locales through four real Web runtimes
        timeout-minutes: 11
        env:
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/passive-atom-evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node --test scripts/test/passive-atom-docs-evidence.test.mjs
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          "$CHROME_PATH" --version > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser-version.txt"
          timeout --signal=TERM --kill-after=10s 600s \
            corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/demo-passive-atoms.browser.test.ts \
            2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser.log"
      - name: Retain original candidate-bound screenshots and facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-atom-docs-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/passive-atom-evidence/
          if-no-files-found: warn
          retention-days: 30

  cold-search-profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile_search }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare the same supported browser and font environment
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
      - name: Sample one real cold Search case without changing its deadline
        env:
          PROTO_UI_SEARCH_CPU_PROFILE: '1'
          PROTO_UI_RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/passive-atom-search-profile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$PROTO_UI_RUNTIME_EVIDENCE_DIR"
          git rev-parse HEAD > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/source-sha.txt"
          "$CHROME_PATH" --version > "$PROTO_UI_RUNTIME_EVIDENCE_DIR/browser-version.txt"
          timeout --signal=TERM --kill-after=10s 300s \
            corepack pnpm@10.32.1 exec vitest run --no-file-parallelism \
            apps/www/src/content/docs/zh-cn/site-search-commands.browser.test.ts \
            -t 'shadcn dark 390px preserves activation, dismissal and focus' \
            2>&1 | tee "$PROTO_UI_RUNTIME_EVIDENCE_DIR/diagnostic.log"
      - name: Require an actual source-bound diagnostic sample
        if: always()
        env:
          PROFILE_DIRECTORY: ${{ runner.temp }}/passive-atom-search-profile/search-commands
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const prefix = `${process.env.PROFILE_DIRECTORY}/shadcn-dark-390-startup`;
          const metadata = JSON.parse(readFileSync(`${prefix}-profile.json`, 'utf8'));
          const profile = JSON.parse(readFileSync(`${prefix}.cpuprofile`, 'utf8'));
          assert.equal(metadata.source.sha, process.env.CANDIDATE_SHA);
          assert.equal(metadata.source.dirty, false);
          assert.equal(metadata.case, 'shadcn-dark-390');
          assert.match(metadata.caveat, /overhead/);
          assert.ok(profile.nodes.length > 0 && profile.samples.length > 0);
          JS
      - name: Retain diagnostic samples and unmodified readiness outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-atom-search-profile-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/passive-atom-search-profile/
          if-no-files-found: error
          retention-days: 30
