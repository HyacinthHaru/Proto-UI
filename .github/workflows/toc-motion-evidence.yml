name: TOC shared motion evidence

on:
  pull_request:
    paths:
      - '.github/workflows/toc-motion-evidence.yml'
      - 'apps/www/scripts/toc-motion/**'
      - 'apps/www/scripts/reading-reference-production.mjs'
      - 'apps/www/scripts/reading-reference-contract.mjs'
      - 'apps/www/scripts/search-production-preview.mjs'
      - 'apps/www/src/components/override/TableOfContents/**'
      - 'apps/www/src/components/site-native-controls*'
      - 'apps/www/src/components/site-native-link-facts*'
      - 'apps/www/src/components/site-link-recipes*'
      - 'apps/www/src/components/PrototypePreviewer/projection-theme*'
      - 'apps/www/src/styles/site-native-links.css'
      - 'apps/www/src/styles/right-sidebar.css'
      - 'apps/www/src/styles/site-header.css'
      - 'apps/www/src/styles/tailwindcss.css'
      - 'apps/www/src/styles/shadcn-theme.css'
      - 'apps/www/src/styles/proto-ui-*.css'
      - 'apps/www/src/styles/markdown.css'
      - 'apps/www/src/components/site-typography*'
      - 'apps/www/src/components/override/Header.astro'
      - 'apps/www/src/components/override/TwoColumnContent.astro'
      - 'packages/prototypes/base/src/surface/**'
      - 'packages/prototypes/shadcn/src/surface/**'
      - 'packages/prototypes/brutalist/src/surface/**'
      - 'packages/adapters/web-component/src/**'
      - 'apps/www/astro.config.mjs'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: toc-motion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and real CJK fonts
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
          APT_NETWORK=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${APT_NETWORK[@]}" update -qq
          sudo apt-get "${APT_NETWORK[@]}" install -y --no-install-recommends fonts-noto-cjk
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/toc-motion"
          "$CHROME" --version | tee "$RUNNER_TEMP/toc-motion/browser-environment.txt"
          fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn' | tee "$RUNNER_TEMP/toc-motion/font-environment.txt"
      - name: Verify motion evidence contracts
        run: node --test apps/www/scripts/toc-motion/motion-contract.test.mjs
      - name: Build exact candidate once and bind production bytes
        timeout-minutes: 10
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PROTO_UI_EXPECTED_HEAD: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_READING_EVIDENCE_DIR: ${{ runner.temp }}/toc-motion
        run: |
          set -euo pipefail
          node apps/www/scripts/reading-reference-production.mjs begin-build
          corepack pnpm@10.32.1 --filter apps-www build 2>&1 | tee "$PROTO_UI_READING_EVIDENCE_DIR/build.log"
          node apps/www/scripts/reading-reference-production.mjs finish-build
      - name: Capture actual motion and reduced-motion with native anchors
        timeout-minutes: 10
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PROTO_UI_EXPECTED_HEAD: ${{ env.CANDIDATE_SHA }}
          PROTO_UI_TOC_OUT: ${{ runner.temp }}/toc-motion
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s node apps/www/scripts/toc-motion/capture-toc-motion.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toc-motion-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/toc-motion
          if-no-files-found: warn
          retention-days: 14
