name: Homepage visual evidence

on:
  pull_request:
    paths:
      - '.github/workflows/homepage-visual-evidence.yml'
      - 'apps/www/**'
      - 'packages/adapters/**'
      - 'packages/prototypes/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Public homepage only; no secrets, deployment, repository writes or privileged
# PR context. Artifacts are review evidence, not a new branch-protection gate.
permissions:
  contents: read

concurrency:
  group: homepage-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: 1fd4c08a067a8322295c78b2b708d2b4cbc01304
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check out immutable before revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the official Ubuntu CJK font package for both revisions
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          {
            dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk fontconfig
            fc-match -f '%{family}\n%{file}\n' 'sans-serif:lang=zh-cn'
          } | tee "$RUNNER_TEMP/homepage-evidence/font-environment.txt"
      - name: Install locked dependencies in both isolated worktrees
        id: install
        timeout-minutes: 5
        run: |
          corepack enable
          for worktree in baseline candidate; do
            (cd "$worktree" && corepack pnpm@10.32.1 install --frozen-lockfile --ignore-scripts)
          done
      - name: Disable only the developer toolbar through Astro project preferences
        timeout-minutes: 2
        run: |
          set -euo pipefail
          {
            echo 'Renderer: supported Astro dev server; same project-local devToolbar preference on baseline and candidate'
            for worktree in baseline candidate; do
              echo "Checkout: $worktree"
              (
                cd "$worktree"
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences disable devToolbar
                corepack pnpm@10.32.1 --filter apps-www exec astro preferences get devToolbar.enabled
              )
            done
          } | tee "$RUNNER_TEMP/homepage-evidence/renderer-environment.txt"
          echo 'PROTO_UI_EVIDENCE_TOOLBAR=disabled-by-project-preference' >> "$GITHUB_ENV"
      - name: Locate runner-provided Chrome
        id: chrome
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser) || {
            echo 'BLOCKED: runner has no Chrome/Chromium executable'; exit 1;
          }
          "$CHROME" --version | tee "$RUNNER_TEMP/homepage-evidence/browser-environment.txt"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Test evidence provenance and acceptance predicates
        working-directory: candidate
        run: node --import tsx --test apps/www/scripts/homepage-evidence-contract.test.ts
      - name: Capture real baseline with the candidate-owned browser probe
        if: always() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx "$GITHUB_WORKSPACE/candidate/apps/www/scripts/capture-homepage-evidence.ts" \
            --revision-kind baseline --expected-revision "$BASELINE_SHA" \
            --out "$RUNNER_TEMP/homepage-evidence/baseline" \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/baseline.log"
      - name: Make baseline evidence available before candidate execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-baseline-${{ env.BASELINE_SHA }}-probe-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/baseline
            ${{ runner.temp }}/homepage-evidence/baseline.log
            ${{ runner.temp }}/homepage-evidence/*-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Capture real exact-head candidate with the same browser probe
        if: always() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 10
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          timeout --signal=TERM --kill-after=10s 540s \
            node --import tsx apps/www/scripts/capture-homepage-evidence.ts \
            --revision-kind candidate --expected-revision "$CANDIDATE_SHA" \
            --out "$RUNNER_TEMP/homepage-evidence/candidate" \
            2>&1 | tee "$RUNNER_TEMP/homepage-evidence/candidate.log"
      - name: Make candidate images available before the regression suites finish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/homepage-evidence/candidate
            ${{ runner.temp }}/homepage-evidence/candidate.log
            ${{ runner.temp }}/homepage-evidence/*-environment.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Execute focused real-browser regressions on the exact candidate
        if: always() && steps.install.outcome == 'success' && steps.chrome.outcome == 'success'
        timeout-minutes: 12
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/homepage-evidence"
          suites=(
            apps/www/src/content/docs/zh-cn/homepage-dogfood.browser.test.ts
            apps/www/src/content/docs/zh-cn/home-demo-runtime.browser.test.ts
            apps/www/src/content/docs/zh-cn/prototype-projection-scope.browser.test.ts
            apps/www/src/content/docs/zh-cn/code-surfaces.browser.test.ts
          )
          for suite in "${suites[@]}"; do test -f "$suite"; done
          {
            git rev-parse HEAD
            printf 'Selected suite: %s\n' "${suites[@]}"
            timeout --signal=TERM --kill-after=10s 600s \
              corepack pnpm@10.32.1 exec vitest run --no-file-parallelism "${suites[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/homepage-evidence/browser-regressions.log"
      - name: Retain actual images, measurements and failure output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/homepage-evidence
          if-no-files-found: warn
          retention-days: 30
